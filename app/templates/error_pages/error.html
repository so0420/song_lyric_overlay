{% extends "base/base.html" %}

{% block title %}{{ status_code }} - 오류 발생{% endblock %}

{% block extra_styles %}
<style>
.error-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - var(--header-height) - 160px);
    text-align: center;
    padding-bottom: 80px;
}

.status-badge {
    background: var(--accent-light);
    color: var(--accent);
    padding: 8px 16px;
    border-radius: 100px;
    font-weight: 700;
    font-size: 0.9rem;
    margin-bottom: 24px;
    border: 1px solid rgba(147, 51, 234, 0.1);
}

.error-title {
    font-size: 3rem;
    font-weight: 800;
    margin-bottom: 16px;
    color: var(--text-main);
}

.error-detail {
    color: var(--text-sub);
    max-width: 480px;
    margin-bottom: 40px;
    font-size: 1.1rem;
    line-height: 1.6;
}

.error-icon {
    font-size: 4rem;
    margin-bottom: 24px;
    animation: bounce 2s ease-in-out infinite;
}

@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}
</style>
{% endblock %}

{% block content %}
<div class="error-container">
    <div class="status-badge">Error {{ status_code }}</div>
    <div class="error-icon">⚠️</div>
    <h1 class="error-title">문제가 발생했습니다</h1>
    <p class="error-detail">
        {{ detail or "알 수 없는 오류가 발생했습니다. 잠시 후 다시 시도해 주세요." }}
    </p>
    
    <a href="/" class="btn btn-primary">
        홈으로 돌아가기
    </a>
</div>
{% endblock %}
