<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가사 보기 - Jamku Song</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Nanum+Gothic:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <script src="/static/js/overlay_fonts.js"></script>
    <style>
        @font-face {
            font-family: 'OngleipParkDahyeon';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2411-3@1.0/Ownglyph_ParkDaHyun.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Umdot';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-4@1.1/Umdot12.woff2') format('woff2');
            font-weight: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'GangwonEducationModuche';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/GangwonEdu_OTFLightA.woff') format('woff');
            font-weight: 300;
            font-display: swap;
        }
        @font-face {
            font-family: 'GangwonEducationModuche';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2201-2@1.0/GangwonEdu_OTFBoldA.woff') format('woff');
            font-weight: 700;
            font-display: swap;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* 글자 모양은 OBS 오버레이 설정을 그대로 따른다.
           (현재 줄 / 지나간 줄 / 앞으로 부를 줄 = 오버레이의 현재 / 이전 / 다음 줄) */
        :root {
            --lv-font: 'Pretendard', 'Noto Sans KR', sans-serif;
            --lv-cur-size: 52px;
            --lv-past-size: 36px;
            --lv-next-size: 36px;
            --lv-cur-weight: 800;
            --lv-past-weight: 600;
            --lv-next-weight: 600;
            --lv-cur-color: #ffe500;
            --lv-past-color: #ffffff;
            --lv-next-color: #ffffff;
            --lv-cur-stroke: 0px;
            --lv-past-stroke: 0px;
            --lv-next-stroke: 0px;
            --lv-stroke-c: #000000;
            --lv-line2-ratio: 0.85;
            --lv-line3-ratio: 0.85;
            --lv-align: center;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #0f172a;
            color: var(--lv-next-color);
            font-family: var(--lv-font);
        }

        /* OBS 브라우저 소스용 — 배경을 빼고 영상 위에 얹는다 */
        body.bg-transparent { background: transparent; }

        .lv-root {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        /* ===== 머리말 (창으로 열었을 때만) ===== */
        .lv-header {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            background: rgba(15, 23, 42, 0.92);
            border-bottom: 1px solid rgba(148, 163, 184, 0.25);
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
        }

        .lv-song {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            align-items: baseline;
            gap: 8px;
            overflow: hidden;
        }

        .lv-song-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lv-song-artist {
            font-size: 0.8rem;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .lv-tools {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lv-size {
            display: flex;
            align-items: center;
            gap: 2px;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 8px;
            padding: 2px;
        }

        .lv-btn {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 8px;
            color: #e2e8f0;
            font-family: inherit;
            font-size: 0.78rem;
            padding: 5px 10px;
            cursor: pointer;
            white-space: nowrap;
        }

        .lv-btn:hover { background: rgba(51, 65, 85, 0.95); }

        .lv-size .lv-btn {
            border: none;
            background: transparent;
            padding: 2px 8px;
            font-size: 0.95rem;
            line-height: 1.2;
        }

        .lv-size-val {
            font-size: 0.75rem;
            color: #94a3b8;
            min-width: 28px;
            text-align: center;
        }

        .lv-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            flex: 0 0 auto;
        }

        .lv-status.off { background: #ef4444; }

        /* ===== 가사 스크롤 영역 ===== */
        .lv-scroll {
            flex: 1 1 auto;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0 24px;
            /* OBS 브라우저 소스에서는 스크롤바가 화면에 찍히면 안 된다 */
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, 0.5) transparent;
        }

        body.no-chrome .lv-scroll { scrollbar-width: none; }
        body.no-chrome .lv-scroll::-webkit-scrollbar { width: 0; height: 0; }

        .lv-scroll::-webkit-scrollbar { width: 8px; }
        .lv-scroll::-webkit-scrollbar-track { background: transparent; }
        .lv-scroll::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.45);
            border-radius: 4px;
        }

        /* 첫 줄·마지막 줄도 화면 한가운데로 올 수 있도록 위아래를 비워 둔다 */
        .lv-pad { height: 45vh; }

        .lv-line {
            /* 아직 부르지 않은 줄 = 오버레이의 '다음 가사' 스타일 */
            font-size: var(--lv-next-size);
            font-weight: var(--lv-next-weight);
            color: var(--lv-next-color);
            line-height: 1.35;
            text-align: var(--lv-align);
            padding: 8px 0;
            opacity: 0.6;
            transition: opacity 0.25s ease, color 0.25s ease;
            word-break: keep-all;
            overflow-wrap: anywhere;
        }

        /* 이미 부른 줄 = 오버레이의 '이전 가사' 스타일. 지금 위치가 한눈에 보이게 더 흐리다 */
        .lv-line.past {
            font-size: var(--lv-past-size);
            font-weight: var(--lv-past-weight);
            color: var(--lv-past-color);
            opacity: 0.35;
        }

        .lv-line.current {
            font-size: var(--lv-cur-size);
            font-weight: var(--lv-cur-weight);
            color: var(--lv-cur-color);
            opacity: 1;
        }

        /* 외국어 가사의 발음·해석 줄. em 이라 어느 줄에 붙어도 그 줄 크기를 기준으로 줄어든다 */
        .lv-line .lv-sub { display: block; }
        .lv-line .lv-l2 { font-size: calc(1em * var(--lv-line2-ratio)); }
        .lv-line .lv-l3 { font-size: calc(1em * var(--lv-line3-ratio)); }

        body.stroke .lv-line {
            -webkit-text-stroke: var(--lv-next-stroke) var(--lv-stroke-c);
            paint-order: stroke fill;
        }

        body.stroke .lv-line.past { -webkit-text-stroke: var(--lv-past-stroke) var(--lv-stroke-c); }
        body.stroke .lv-line.current { -webkit-text-stroke: var(--lv-cur-stroke) var(--lv-stroke-c); }

        body.shadow .lv-line { text-shadow: 0 6px 12px rgba(0, 0, 0, 0.6); }

        /* ===== 우상단 '가사 따라가기' ===== */
        .lv-follow {
            position: absolute;
            top: 10px;
            right: 16px;
            z-index: 5;
            display: none;
            align-items: center;
            gap: 6px;
            padding: 7px 12px;
            border: none;
            border-radius: 999px;
            background: rgba(37, 99, 235, 0.95);
            color: #fff;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }

        .lv-follow:hover { background: rgba(29, 78, 216, 0.98); }
        .lv-follow.visible { display: inline-flex; }

        /* 머리말이 있으면 그 아래에 뜨도록 */
        body.has-chrome .lv-follow { top: 56px; }

        /* OBS 화면에는 조작 버튼이 절대 찍히면 안 된다 (스크롤 상태는 창에서 넘어온다) */
        body.no-chrome .lv-follow { display: none !important; }

        /* 안내·오류 문구도 마찬가지다. 곡 사이나 연결이 끊긴 동안 방송 화면 한가운데에
           한국어 안내가 찍히면 사고다. (기존 obs_overlay.html 도 같은 이유로 idle 문구를 막아 뒀다) */
        body.no-chrome .lv-empty { display: none !important; }

        /* ===== 빈 상태 ===== */
        .lv-empty {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            font-size: 0.95rem;
            line-height: 1.7;
            color: #94a3b8;
            pointer-events: none;
        }

        .lv-empty.visible { display: flex; }
    </style>
</head>
<body>
    <div class="lv-root">
        <header class="lv-header" id="lvHeader" style="display: none;">
            <div class="lv-song">
                <span class="lv-song-title" id="lvTitle">재생 대기 중</span>
                <span class="lv-song-artist" id="lvArtist"></span>
            </div>
            <div class="lv-tools">
                <div class="lv-size" title="가사 글자 크기 (100% = 오버레이 설정 그대로). OBS의 이 가사 화면도 함께 바뀝니다 — 3줄 메인 오버레이는 그대로입니다">
                    <button type="button" class="lv-btn" id="sizeDown">−</button>
                    <span class="lv-size-val" id="sizeVal">100%</span>
                    <button type="button" class="lv-btn" id="sizeUp">+</button>
                </div>
                <button type="button" class="lv-btn" id="alignToggle" title="가사 정렬 (OBS에도 바로 반영됩니다)">가운데</button>
                <button type="button" class="lv-btn" id="bgToggle" title="OBS에 넣을 때는 투명 배경을 쓰세요">배경 투명</button>
                <button type="button" class="lv-btn" id="copyObsUrl" title="지금 보이는 모양 그대로 OBS 브라우저 소스에 넣을 URL을 복사합니다">OBS URL 복사</button>
                <span class="lv-status off" id="lvStatus" title="노래하기 연결 상태"></span>
            </div>
        </header>

        <button type="button" class="lv-follow" id="followBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 5v14"></path>
                <path d="m19 12-7 7-7-7"></path>
            </svg>
            가사 따라가기
        </button>

        <div class="lv-scroll" id="lvScroll">
            <div class="lv-pad"></div>
            <div id="lvLines"></div>
            <div class="lv-pad"></div>
        </div>

        <div class="lv-empty visible" id="lvEmpty">
            노래하기 화면에서 곡을 재생하면<br>여기에 전체 가사가 표시됩니다.
        </div>
    </div>

    <script>
        const overlayToken = {{ overlay_token | tojson }};
        const initialSettings = {{ settings | tojson if settings else 'null' }};
        // 토큰이 URL에 들어 있으면 OBS 브라우저 소스로 보는 중이라 조작 UI 를 숨긴다.
        const showChrome = {{ 'true' if show_chrome else 'false' }};

        // OBS 오버레이와 같은 글자 설정을 쓴다 (기본값도 오버레이 쪽과 맞춘다)
        const defaultSettings = {
            font_family: 'Pretendard',
            font_size: 52,
            highlight_color: '#FFE500',
            current_line_weight: 800,
            prev_line_weight: 600,
            next_line_weight: 600,
            text_stroke: true,
            stroke_color: '#000000',
            current_line_stroke: 3,
            prev_line_stroke: 2,
            next_line_stroke: 2,
            text_shadow: true,
            lyrics_position: 'bottom-center',
            show_lyrics_line1: true,
            show_lyrics_line2: true,
            show_lyrics_line3: true,
        };

        let settings = { ...defaultSettings, ...(initialSettings || {}) };

        const scroller = document.getElementById('lvScroll');
        const linesBox = document.getElementById('lvLines');
        const followBtn = document.getElementById('followBtn');
        const emptyBox = document.getElementById('lvEmpty');
        const header = document.getElementById('lvHeader');
        const titleEl = document.getElementById('lvTitle');
        const artistEl = document.getElementById('lvArtist');
        const statusEl = document.getElementById('lvStatus');
        const sizeValEl = document.getElementById('sizeVal');

        // ===== 보기 설정 (URL > localStorage > 기본값) =====
        const params = new URLSearchParams(location.search);
        const SCALE_MIN = 40, SCALE_MAX = 200;
        const ALIGNS = ['left', 'center', 'right'];
        const ALIGN_LABEL = { left: '왼쪽', center: '가운데', right: '오른쪽' };

        // 글자 크기는 오버레이 설정을 그대로 쓰되, 창 크기에 맞춰 배율만 따로 둔다.
        // (좁은 창에서 52px 는 너무 크고, OBS 는 1920 폭이라 원래 크기가 맞다)
        function readScale() {
            const fromUrl = parseInt(params.get('scale'), 10);
            if (fromUrl >= SCALE_MIN && fromUrl <= SCALE_MAX) return fromUrl;
            const saved = parseInt(localStorage.getItem('lyrics_view_scale'), 10);
            if (saved >= SCALE_MIN && saved <= SCALE_MAX) return saved;
            // 창과 OBS 가 같은 배율을 쓰므로 기본값도 같아야 한다.
            // (100% = 오버레이 설정의 글자 크기 그대로)
            return 100;
        }

        function readTransparent() {
            if (params.has('bg')) return params.get('bg') === 'transparent';
            return localStorage.getItem('lyrics_view_bg') === 'transparent';
        }

        // 정렬은 오버레이의 가사 위치(bottom-left/center/right)를 기본값으로 삼되
        // 이 화면에서 따로 고를 수 있다.
        function readAlign() {
            const fromUrl = params.get('align');
            if (ALIGNS.includes(fromUrl)) return fromUrl;
            const saved = localStorage.getItem('lyrics_view_align');
            if (ALIGNS.includes(saved)) return saved;
            const pos = String(settings.lyrics_position || 'bottom-center');
            if (pos.endsWith('-left')) return 'left';
            if (pos.endsWith('-right')) return 'right';
            return 'center';
        }

        let scale = readScale();
        let transparent = readTransparent();
        let align = readAlign();

        function px(v) { return Math.max(1, Math.round(v)) + 'px'; }

        function applyView() {
            const root = document.documentElement.style;
            const base = (settings.font_size || 52) * scale / 100;
            const prevRatio = (settings.prev_line_size_ratio || 70) / 100;
            const nextRatio = (settings.next_line_size_ratio || 70) / 100;

            if (typeof ensureOverlayFont === 'function') ensureOverlayFont(settings.font_family);
            root.setProperty('--lv-font',
                `'${settings.font_family}', 'Pretendard', 'Noto Sans KR', sans-serif`);

            root.setProperty('--lv-cur-size', px(base));
            root.setProperty('--lv-past-size', px(base * prevRatio));
            root.setProperty('--lv-next-size', px(base * nextRatio));

            root.setProperty('--lv-cur-weight', String(settings.current_line_weight || 800));
            root.setProperty('--lv-past-weight', String(settings.prev_line_weight || 600));
            root.setProperty('--lv-next-weight', String(settings.next_line_weight || 600));

            root.setProperty('--lv-cur-color', settings.highlight_color || '#FFE500');
            root.setProperty('--lv-past-color', settings.prev_line_color || '#FFFFFF');
            root.setProperty('--lv-next-color', settings.next_line_color || '#FFFFFF');

            // 외곽선 두께도 배율을 따라간다 (작게 줄인 창에서 글자가 뭉개지지 않게)
            const sw = scale / 100;
            root.setProperty('--lv-cur-stroke', px((settings.current_line_stroke || 3) * sw));
            root.setProperty('--lv-past-stroke', px((settings.prev_line_stroke || 2) * sw));
            root.setProperty('--lv-next-stroke', px((settings.next_line_stroke || 2) * sw));
            root.setProperty('--lv-stroke-c', settings.stroke_color || '#000000');

            root.setProperty('--lv-line2-ratio', String((settings.lyrics_line2_size_ratio || 85) / 100));
            root.setProperty('--lv-line3-ratio', String((settings.lyrics_line3_size_ratio || 85) / 100));

            root.setProperty('--lv-align', align);

            document.body.classList.toggle('bg-transparent', transparent);
            // 외곽선 여부도 오버레이 설정을 그대로 따른다. 투명 배경이라고 강제로 켜면
            // 외곽선을 꺼 둔 사람에게만 이 화면의 글씨가 달라진다.
            document.body.classList.toggle('stroke', !!settings.text_stroke);
            document.body.classList.toggle('shadow', settings.text_shadow !== false);
            document.body.classList.toggle('has-chrome', showChrome);
            document.body.classList.toggle('no-chrome', !showChrome);

            if (sizeValEl) sizeValEl.textContent = scale + '%';
            const bgBtn = document.getElementById('bgToggle');
            if (bgBtn) bgBtn.textContent = transparent ? '배경 어둡게' : '배경 투명';
            const alignBtn = document.getElementById('alignToggle');
            if (alignBtn) alignBtn.textContent = ALIGN_LABEL[align];
        }

        // 지금 보고 있는 모양을 URL 에 남겨 둔다 (그대로 복사해 OBS 에 붙일 수 있게)
        function syncUrl() {
            const q = new URLSearchParams(location.search);
            q.set('scale', String(scale));
            q.set('bg', transparent ? 'transparent' : 'dark');
            q.set('align', align);
            history.replaceState(null, '', location.pathname + '?' + q.toString());
        }

        if (showChrome) header.style.display = 'flex';
        applyView();

        // ===== 가사 렌더링 =====
        let lyricsData = null;
        let lineEls = [];
        let syncTime = 0;
        let syncReceivedAt = 0;
        let isPlaying = false;
        let lastCur = -2;      // 마지막으로 칠한 '현재 줄'
        let lastFocus = -2;    // 마지막으로 화면 가운데에 둔 줄
        let rafId = null;
        let following = true;
        let songKey = null;
        // 자동 정렬로 움직이는 중인 구간 (scroll 이벤트가 우리 것인지 가르는 데 쓴다)
        let animFrom = 0, animTo = 0, animActive = false, animEndsAt = 0;

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 외국어 가사는 '\n' 으로 원문/발음/해석이 이어져 있다 (OBS 오버레이와 같은 규칙)
        function formatLyrics(text) {
            if (!text) return '&nbsp;';
            const parts = text.split('\\n');
            if (parts.length === 1) return escapeHtml(text);

            const show = [
                settings.show_lyrics_line1 !== false,
                settings.show_lyrics_line2 !== false,
                settings.show_lyrics_line3 !== false,
            ];
            const visible = [];
            for (let i = 0; i < parts.length; i++) {
                if (i < 3 && !show[i]) continue;
                const escaped = escapeHtml(parts[i]);
                // 2·3번째 줄은 오버레이와 같은 비율로 작게 (lv-l2 / lv-l3)
                visible.push(i === 0
                    ? escaped
                    : `<span class="lv-sub lv-l${Math.min(i + 1, 3)}">${escaped}</span>`);
            }
            return visible.join('') || '&nbsp;';
        }

        function renderAllLines() {
            linesBox.innerHTML = '';
            lineEls = [];
            if (!lyricsData || !lyricsData.length) return;

            const frag = document.createDocumentFragment();
            lyricsData.forEach((line, i) => {
                const p = document.createElement('p');
                p.className = 'lv-line';
                p.dataset.i = String(i);
                p.innerHTML = formatLyrics(line.text);
                frag.appendChild(p);
                lineEls.push(p);
            });
            linesBox.appendChild(frag);
        }

        function findLyricsIndex(lyrics, time) {
            for (let i = 0; i < lyrics.length; i++) {
                if (time >= lyrics[i].start && time < lyrics[i].end) return i;
            }
            return -1;
        }

        // 가사와 가사 사이(간주)에서는 '다음에 부를 줄'을 기준으로 삼는다
        function focusIndexFor(time) {
            if (!lyricsData || !lyricsData.length) return -1;
            const idx = findLyricsIndex(lyricsData, time);
            if (idx !== -1) return idx;
            for (let i = 0; i < lyricsData.length; i++) {
                if (lyricsData[i].start > time) return i;
            }
            return lyricsData.length - 1;
        }

        function getInterpolatedTime() {
            if (!isPlaying) return syncTime;
            return syncTime + (performance.now() - syncReceivedAt);
        }

        function scrollToIndex(i, smooth) {
            const el = lineEls[i];
            if (!el) return;
            const target = el.offsetTop + el.offsetHeight / 2 - scroller.clientHeight / 2;
            const max = Math.max(0, scroller.scrollHeight - scroller.clientHeight);
            const top = Math.max(0, Math.min(target, max));
            const far = Math.abs(top - scroller.scrollTop) > scroller.clientHeight * 3;
            const behavior = (smooth && !far) ? 'smooth' : 'auto';

            // 스크롤바를 끌었는지 알아내려면 scroll 이벤트를 봐야 하는데, 우리가 만든
            // 스크롤도 같은 이벤트를 낸다. '시간'으로 걸러내면 자동 정렬이 잦은 구간에서
            // 사용자 조작까지 함께 묻히므로, 지금 움직이는 구간(from~to) 안에 있는지로 가른다.
            animFrom = scroller.scrollTop;
            animTo = top;
            animActive = true;
            animEndsAt = performance.now() + (behavior === 'smooth' ? 900 : 150);

            scroller.scrollTo({ top, behavior });
        }

        function paint(cur, time) {
            for (let i = 0; i < lineEls.length; i++) {
                const el = lineEls[i];
                el.classList.toggle('current', i === cur);
                el.classList.toggle('past', i !== cur && lyricsData[i].end <= time);
            }
        }

        function updateTo(time, force) {
            if (!lyricsData || !lyricsData.length) return;
            const cur = findLyricsIndex(lyricsData, time);
            // 간주 구간에서는 '다음에 부를 줄'을 화면 가운데에 둔다
            const focus = cur !== -1 ? cur : focusIndexFor(time);
            if (!force && cur === lastCur && focus === lastFocus) return;
            lastCur = cur;
            lastFocus = focus;
            paint(cur, time);
            if (following) scrollToIndex(focus, true);
        }

        function renderLoop() {
            updateTo(getInterpolatedTime(), false);
            rafId = requestAnimationFrame(renderLoop);
        }

        function startLoop() {
            stopLoop();
            // 그릴 가사가 없으면 돌 이유가 없다 (가사 없는 곡을 트는 동안 빈 루프가 돌지 않게)
            if (!lyricsData || !lyricsData.length) return;
            rafId = requestAnimationFrame(renderLoop);
        }

        function stopLoop() {
            if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
        }

        function setFollowing(on) {
            const changed = following !== on;
            following = on;
            followBtn.classList.toggle('visible', !on);
            if (changed) sendViewState();
        }

        function onUserScroll() {
            if (!following) return;
            setFollowing(false);
        }

        // ===== 스크롤 상태를 OBS 쪽 같은 화면으로 중계 =====
        // 창(조작 UI 가 있는 쪽)만 보내고, OBS 쪽은 받기만 한다. 서로 보내면 스크롤이
        // 서로를 밀어내므로 방향을 한쪽으로 고정한다.
        const isController = showChrome;
        let lastSentAt = 0;
        let sendTimer = null;
        // 조작 주체가 살아 있다는 신호. 이게 끊기면 OBS 는 스스로 자동 정렬로 돌아간다.
        const HEARTBEAT_MS = 3000;
        const CONTROL_TIMEOUT_MS = 9000;
        let lastControlAt = 0;

        // 화면 한가운데에 있는 줄. 창과 OBS 는 크기·글자 크기가 달라 픽셀 위치를 그대로
        // 옮길 수 없으므로 '몇 번째 줄이 가운데인가'로 주고받는다.
        function centerLineIndex() {
            if (!lineEls.length) return -1;
            const mid = scroller.scrollTop + scroller.clientHeight / 2;
            let best = -1, bestD = Infinity;
            for (let i = 0; i < lineEls.length; i++) {
                const el = lineEls[i];
                const d = Math.abs(el.offsetTop + el.offsetHeight / 2 - mid);
                if (d < bestD) { bestD = d; best = i; }
            }
            return best;
        }

        function sendViewState() {
            if (!isController) return;
            if (!ws || ws.readyState !== WebSocket.OPEN) return;

            // 끌고 있는 동안 매 프레임 보내지 않도록 묶어서 보낸다
            const now = performance.now();
            const wait = 120 - (now - lastSentAt);
            if (wait > 0) {
                if (!sendTimer) sendTimer = setTimeout(() => { sendTimer = null; sendViewState(); }, wait);
                return;
            }
            if (sendTimer) { clearTimeout(sendTimer); sendTimer = null; }
            lastSentAt = now;

            try {
                ws.send(JSON.stringify({
                    type: 'lyrics_view_scroll',
                    data: {
                        following: following,
                        centerIndex: following ? -1 : centerLineIndex(),
                        align: align,
                        scale: scale,
                    },
                }));
            } catch {}
        }

        function applyViewState(data) {
            if (isController || !data) return;
            lastControlAt = performance.now();

            // 정렬과 글자 배율은 창에서 고른 값을 그대로 따른다.
            // (오버레이 설정 자체는 건드리지 않으므로 3줄 메인 오버레이는 영향을 받지 않는다)
            let looksChanged = false;

            if (ALIGNS.includes(data.align) && data.align !== align) {
                align = data.align;
                looksChanged = true;
            }

            const s = parseInt(data.scale, 10);
            if (s >= SCALE_MIN && s <= SCALE_MAX && s !== scale) {
                scale = s;
                looksChanged = true;
            }

            if (looksChanged) {
                applyView();
                // 글자 크기가 바뀌면 줄 위치가 전부 달라진다 — 보던 자리를 다시 맞춘다
                if (following && lastFocus >= 0) scrollToIndex(lastFocus, false);
            }

            if (data.following) {
                if (!following) {
                    setFollowing(true);
                    const idx = focusIndexFor(getInterpolatedTime());
                    if (idx >= 0) scrollToIndex(idx, true);
                }
                return;
            }

            setFollowing(false);
            // 끌고 있는 중이라 자주 들어온다 — 부드러운 스크롤을 쓰면 뒤처지므로 바로 옮긴다
            if (data.centerIndex >= 0) scrollToIndex(data.centerIndex, false);
        }

        if (isController) {
            // 자동 정렬을 멈춰 둔 동안에는 살아 있다는 신호를 계속 보낸다.
            // 창을 닫거나 죽으면 이 신호가 끊기고 OBS 가 스스로 복구한다.
            setInterval(() => { if (!following) sendViewState(); }, HEARTBEAT_MS);

            // 창을 닫을 때는 곧바로 조작권을 놓는다(신호가 끊기기를 기다리지 않게).
            window.addEventListener('pagehide', () => {
                if (following) return;
                try {
                    ws && ws.readyState === WebSocket.OPEN && ws.send(JSON.stringify({
                        type: 'lyrics_view_scroll',
                        data: { following: true, centerIndex: -1, align: align, release: true },
                    }));
                } catch {}
            });
        } else {
            // OBS 쪽: 조작 주체가 사라졌는데도 멈춘 채로 남으면 곡이 끝날 때까지
            // 틀린 가사를 방송하게 된다. 신호가 끊기면 자동 정렬로 되돌아간다.
            setInterval(() => {
                if (following || !lastControlAt) return;
                if (performance.now() - lastControlAt < CONTROL_TIMEOUT_MS) return;
                lastControlAt = 0;
                setFollowing(true);
                const idx = focusIndexFor(getInterpolatedTime());
                if (idx >= 0) scrollToIndex(idx, true);
            }, 2000);
        }

        // OBS 쪽 화면은 사람이 손댈 일이 없다. 스크롤 상태는 오직 창에서 받아 적용하므로
        // 감지 자체를 달지 않는다 (자동 정렬을 사용자 조작으로 오인할 여지를 없앤다).
        if (isController) {
        scroller.addEventListener('wheel', onUserScroll, { passive: true });
        scroller.addEventListener('touchmove', onUserScroll, { passive: true });
        scroller.addEventListener('scroll', () => {
            // 스크롤바 끌기는 wheel/touch 가 아니라 scroll 이벤트만 남긴다.
            const top = scroller.scrollTop;
            if (animActive) {
                const lo = Math.min(animFrom, animTo) - 4;
                const hi = Math.max(animFrom, animTo) + 4;
                if (top >= lo && top <= hi) {
                    // 자동 정렬이 지나가는 길 위 → 우리가 만든 스크롤이다.
                    // 목적지에 닿으면 '길'을 그 점으로 좁힌다. 구간 자체를 닫아 버리면
                    // 애니메이션이 마지막으로 흘리는 이벤트까지 사용자 조작으로 오인한다.
                    if (Math.abs(top - animTo) < 2) animFrom = animTo;
                    else if (performance.now() > animEndsAt) animFrom = animTo = top;
                    return;
                }
                animActive = false;   // 길 밖으로 튀었다 → 사용자가 끌었다
            }
            onUserScroll();
            // 끌고 있는 동안에도 OBS 가 같은 자리를 보도록 계속 알린다
            if (!following) sendViewState();
        }, { passive: true });

        document.addEventListener('keydown', (e) => {
            const keys = ['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End', ' '];
            if (keys.includes(e.key)) onUserScroll();
        });
        }   // isController

        followBtn.addEventListener('click', () => {
            setFollowing(true);
            const idx = focusIndexFor(getInterpolatedTime());
            if (idx >= 0) scrollToIndex(idx, true);
        });

        window.addEventListener('resize', () => {
            if (following && lastFocus >= 0) scrollToIndex(lastFocus, false);
        });

        // ===== 곡 정보 =====
        function updateSongInfo(title, artist) {
            if (!showChrome) return;
            titleEl.textContent = title || '재생 대기 중';
            artistEl.textContent = artist ? '- ' + artist : '';
        }

        function showEmpty(on) {
            emptyBox.classList.toggle('visible', on);
        }

        function handleLyricsInit(data) {
            updateSongInfo(data.songTitle, data.artist);

            const lyrics = data.lyrics && data.lyrics.length ? data.lyrics : null;
            // 곡이 바뀌었는지 판정하는 열쇠. 제목·줄수·첫 줄만 보면 같은 곡의 다른 가사
            // (자동 가사를 다른 후보로 바꾼 경우 등)를 놓치므로 내용 길이와 끝도 함께 본다.
            const key = lyrics
                ? [
                    data.songTitle || '', data.artist || '', lyrics.length,
                    lyrics[0].start, lyrics[0].text,
                    lyrics[lyrics.length - 1].end,
                    lyrics.reduce((n, l) => n + (l.text ? l.text.length : 0), 0),
                ].join('|')
                : null;

            const songChanged = key !== songKey;
            songKey = key;

            lyricsData = lyrics;
            syncTime = data.currentTime || 0;
            syncReceivedAt = performance.now();
            isPlaying = !!data.isPlaying;
            lastCur = -2;
            lastFocus = -2;

            if (!lyrics) {
                stopLoop();
                linesBox.innerHTML = '';
                lineEls = [];
                showEmpty(true);
                setFollowing(true);
                return;
            }

            // 노래하기 화면은 일시정지·재개·시크 때마다 전체 가사를 다시 보낸다.
            // 내용이 그대로인데 수백 줄을 매번 지웠다 그리면 진행 중인 부드러운 스크롤과
            // 강조 전환이 끊기므로, 곡이 바뀐 경우에만 다시 그린다.
            if (songChanged || lineEls.length !== lyrics.length) renderAllLines();
            showEmpty(false);

            // 다른 곡으로 바뀌면 사용자가 스크롤해 뒀더라도 다시 따라가기 시작한다
            if (songChanged) {
                setFollowing(true);
                scroller.scrollTop = 0;
            }

            updateTo(getInterpolatedTime(), true);
            if (isPlaying) startLoop(); else stopLoop();

            // OBS 브라우저 소스가 새로 붙으면 노래하기 화면이 lyrics_init 을 다시 보낸다.
            // 그 신호를 빌려 지금 보고 있는 위치도 함께 알려 준다 (새로 붙은 쪽이 맞춰지도록).
            sendViewState();
        }

        function handleTimeSync(data) {
            syncTime = data.currentTime;
            syncReceivedAt = performance.now();

            const wasPlaying = isPlaying;
            isPlaying = !!data.isPlaying;

            if (isPlaying && !wasPlaying) {
                startLoop();
            } else if (!isPlaying && wasPlaying) {
                stopLoop();
                updateTo(syncTime, true);
            } else if (!isPlaying) {
                // 정지 상태에서의 구간 이동(시크)
                updateTo(syncTime, false);
            }
        }

        function clearAll() {
            stopLoop();
            lyricsData = null;
            lineEls = [];
            songKey = null;
            linesBox.innerHTML = '';
            isPlaying = false;
            lastCur = -2;
            lastFocus = -2;
            updateSongInfo('', '');
            showEmpty(true);
            setFollowing(true);
        }

        // ===== WebSocket =====
        let ws = null;
        let reconnectTimer = null;
        let tokenInvalidated = false;

        function setStatus(on) {
            statusEl.classList.toggle('off', !on);
        }

        async function connect() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            let url = `${proto}//${location.host}/api/v1/overlay/ws`
                + `?overlay_token=${encodeURIComponent(overlayToken)}`;

            // 조작 권한은 로그인 세션으로만 받을 수 있다. OBS 쪽(토큰 URL)은 세션이 없어
            // 이 요청이 실패하고, 받기만 하는 연결이 된다.
            if (isController) {
                try {
                    const resp = await fetch('/api/v1/overlay/ws-token');
                    if (resp.ok) {
                        const { token } = await resp.json();
                        if (token) url += `&control=${encodeURIComponent(token)}`;
                    }
                } catch {}
            }

            ws = new WebSocket(url);

            ws.onopen = () => {
                if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
                setStatus(true);
                // 끊겨 있는 동안 OBS 는 자동 정렬로 돌아갔을 수 있다. 멈춰 둔 상태였다면 다시 알린다.
                if (isController && !following) sendViewState();
            };

            ws.onmessage = (event) => {
                let msg;
                try { msg = JSON.parse(event.data); } catch { return; }

                switch (msg.type) {
                    case 'ping':
                        ws.send(JSON.stringify({ type: 'pong' }));
                        break;
                    case 'lyrics_init':
                        handleLyricsInit(msg.data || {});
                        break;
                    case 'lyrics_time_sync':
                        handleTimeSync(msg.data || {});
                        break;
                    case 'lyrics_view_scroll':
                        applyViewState(msg.data);
                        break;
                    case 'settings_update':
                        // 오버레이 설정을 저장하면 글자 모양이 곧바로 따라 바뀐다
                        settings = { ...defaultSettings, ...(msg.settings || {}) };
                        applyView();
                        // 발음·해석 줄 표시 여부는 줄 내용 자체를 바꾸므로 다시 그려야 한다
                        if (lyricsData && lyricsData.length) {
                            renderAllLines();
                            const t = getInterpolatedTime();
                            lastCur = -2;
                            lastFocus = -2;
                            updateTo(t, true);
                        }
                        break;
                    case 'clear':
                    case 'song_change':
                        clearAll();
                        break;
                    case 'token_invalidated':
                        tokenInvalidated = true;
                        ws.close();
                        break;
                }
            };

            ws.onclose = () => {
                setStatus(false);
                if (tokenInvalidated) {
                    emptyBox.innerHTML = '오버레이 토큰이 재발급되어 연결이 끊어졌습니다.<br>새 URL로 다시 열어주세요.';
                    showEmpty(true);
                    return;
                }
                reconnectTimer = setTimeout(connect, 3000);
            };

            ws.onerror = () => { try { ws.close(); } catch {} };
        }

        // ===== 머리말 조작 =====
        if (showChrome) {
            function changeScale(delta) {
                scale = Math.min(SCALE_MAX, Math.max(SCALE_MIN, scale + delta));
                localStorage.setItem('lyrics_view_scale', String(scale));
                applyView();
                syncUrl();
                if (following && lastFocus >= 0) scrollToIndex(lastFocus, false);
                sendViewState();   // OBS 가사 화면도 같은 배율로 (3줄 메인 오버레이는 그대로)
            }

            document.getElementById('sizeDown').addEventListener('click', () => changeScale(-10));
            document.getElementById('sizeUp').addEventListener('click', () => changeScale(10));

            document.getElementById('alignToggle').addEventListener('click', () => {
                align = ALIGNS[(ALIGNS.indexOf(align) + 1) % ALIGNS.length];
                localStorage.setItem('lyrics_view_align', align);
                applyView();
                syncUrl();
                sendViewState();   // OBS 쪽 정렬도 함께 바꾼다
            });

            document.getElementById('bgToggle').addEventListener('click', () => {
                transparent = !transparent;
                localStorage.setItem('lyrics_view_bg', transparent ? 'transparent' : 'dark');
                applyView();
                syncUrl();
            });

            document.getElementById('copyObsUrl').addEventListener('click', async (e) => {
                // 지금 보고 있는 모양 그대로 (배율·정렬·배경)
                const url = `${location.origin}/overlay/lyrics`
                    + `?token=${encodeURIComponent(overlayToken)}`
                    + `&scale=${scale}&align=${align}&bg=${transparent ? 'transparent' : 'dark'}`;
                const btn = e.currentTarget;
                try {
                    await navigator.clipboard.writeText(url);
                } catch {
                    const tmp = document.createElement('input');
                    tmp.value = url;
                    document.body.appendChild(tmp);
                    tmp.select();
                    document.execCommand('copy');
                    document.body.removeChild(tmp);
                }
                btn.textContent = '복사됨!';
                setTimeout(() => { btn.textContent = 'OBS URL 복사'; }, 2000);
            });

            syncUrl();
        }

        connect();
    </script>
</body>
</html>
