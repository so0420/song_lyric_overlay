{% extends "admin/base.html" %}

{% block admin_content %}
<div class="admin-header">
    <h1>📬 문의 관리</h1>
</div>

<style>
    .status-filters {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .status-btn {
        padding: 8px 16px;
        border: 1px solid var(--border-color);
        background: white;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.85rem;
        transition: all 0.2s;
    }

    .status-btn.active {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
    }

    .status-btn:hover:not(.active) {
        border-color: var(--accent);
    }

    .inquiry-table {
        width: 100%;
        border-collapse: collapse;
    }

    .inquiry-table th,
    .inquiry-table td {
        padding: 12px 16px;
        text-align: left;
        border-bottom: 1px solid var(--border-color);
    }

    .inquiry-table th {
        background: #f8fafc;
        font-weight: 600;
        font-size: 0.85rem;
        color: var(--text-sub);
    }

    .inquiry-table tr:hover {
        background: #f8fafc;
    }

    .inquiry-table .subject-cell {
        max-width: 250px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .inquiry-table .subject-cell a {
        color: var(--text-main);
        font-weight: 500;
    }

    .inquiry-table .subject-cell a:hover {
        color: var(--accent);
    }

    .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.75rem;
        font-weight: 600;
    }

    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-in_progress { background: #dbeafe; color: #1e40af; }
    .badge-resolved { background: #d1fae5; color: #065f46; }
    .badge-closed { background: #e5e7eb; color: #374151; }

    .empty-state {
        text-align: center;
        padding: 48px 20px;
        color: var(--text-dim);
    }

    .pagination {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 24px;
    }

    .pagination button {
        padding: 8px 16px;
        border: 1px solid var(--border-color);
        background: white;
        border-radius: 6px;
        cursor: pointer;
    }

    .pagination button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
</style>

<div class="status-filters">
    <button class="status-btn active" data-status="">전체</button>
    <button class="status-btn" data-status="pending">대기중</button>
    <button class="status-btn" data-status="in_progress">처리중</button>
    <button class="status-btn" data-status="resolved">답변완료</button>
    <button class="status-btn" data-status="closed">종료</button>
</div>

<table class="inquiry-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>이름</th>
            <th>제목</th>
            <th>상태</th>
            <th>작성일</th>
        </tr>
    </thead>
    <tbody id="inquiryTableBody">
        <tr><td colspan="5" class="empty-state">로딩 중...</td></tr>
    </tbody>
</table>

<div class="pagination" id="pagination" style="display: none;">
    <button id="prevBtn">이전</button>
    <span id="pageInfo"></span>
    <button id="nextBtn">다음</button>
</div>

<script>
let currentPage = 1;
let totalPages = 1;
let currentStatus = '';
const pageSize = 20;

const statusLabels = {
    'pending': '대기중',
    'in_progress': '처리중',
    'resolved': '답변완료',
    'closed': '종료'
};

async function loadInquiries() {
    const tbody = document.getElementById('inquiryTableBody');
    tbody.innerHTML = '<tr><td colspan="5" class="empty-state">로딩 중...</td></tr>';
    
    try {
        let url = `/api/v1/admin/inquiries?page=${currentPage}&page_size=${pageSize}`;
        if (currentStatus) url += `&status=${currentStatus}`;
        
        const response = await fetch(url);
        const data = await response.json();
        
        renderInquiries(data);
        updatePagination(data);
    } catch (error) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">불러오기 실패</td></tr>';
    }
}

function renderInquiries(data) {
    const tbody = document.getElementById('inquiryTableBody');
    const inquiries = data.inquiries;
    
    if (!inquiries || inquiries.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">문의가 없습니다.</td></tr>';
        return;
    }
    
    tbody.innerHTML = inquiries.map(i => `
        <tr>
            <td>${i.id}</td>
            <td>${escapeHtml(i.name)}</td>
            <td class="subject-cell">
                <a href="/admin/inquiries/${i.id}">${escapeHtml(i.subject)}</a>
            </td>
            <td><span class="badge badge-${i.status}">${statusLabels[i.status] || i.status}</span></td>
            <td>${formatDate(i.created_at)}</td>
        </tr>
    `).join('');
}

function updatePagination(data) {
    const el = document.getElementById('pagination');
    totalPages = data.total_pages;
    
    if (data.total > 0) {
        el.style.display = 'flex';
        document.getElementById('pageInfo').textContent = `${currentPage} / ${totalPages}`;
        document.getElementById('prevBtn').disabled = currentPage <= 1;
        document.getElementById('nextBtn').disabled = currentPage >= totalPages;
    } else {
        el.style.display = 'none';
    }
}

function formatDate(dateStr) {
    return new Date(dateStr).toLocaleDateString('ko-KR');
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

document.querySelectorAll('.status-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentStatus = btn.dataset.status;
        currentPage = 1;
        loadInquiries();
    });
});

document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentPage > 1) { currentPage--; loadInquiries(); }
});

document.getElementById('nextBtn').addEventListener('click', () => {
    if (currentPage < totalPages) { currentPage++; loadInquiries(); }
});

loadInquiries();
</script>
{% endblock %}
