{% extends "base/base.html" %}
{% block title %}공지사항 - PlayList{% endblock %}

{% block extra_styles %}
<style>
    .notices-container {
        max-width: 900px;
        margin: 0 auto;
    }

    .notices-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 16px;
    }

    .notices-header h1 {
        font-size: 1.75rem;
        color: var(--text-main);
        margin: 0;
    }

    .search-box {
        display: flex;
        gap: 8px;
    }

    .search-box input {
        padding: 10px 16px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 0.9rem;
        width: 250px;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.1);
    }

    .search-box button {
        padding: 10px 20px;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
    }

    .search-box button:hover {
        opacity: 0.9;
    }

    .notice-list {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        overflow: hidden;
    }

    .notice-item {
        display: flex;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid var(--border-color);
        transition: background 0.2s;
        gap: 12px;
    }

    .notice-item:last-child {
        border-bottom: none;
    }

    .notice-item:hover {
        background: #f8fafc;
    }

    .notice-item.pinned {
        background: var(--accent-light);
    }

    .notice-item.pinned:hover {
        background: #ede9fe;
    }

    .pin-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--accent);
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.7rem;
        font-weight: 600;
        flex-shrink: 0;
    }

    .notice-content {
        flex: 1;
        min-width: 0;
    }

    .notice-title {
        font-weight: 600;
        color: var(--text-main);
        text-decoration: none;
        display: block;
        margin-bottom: 4px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .notice-title:hover {
        color: var(--accent);
    }

    .notice-meta {
        display: flex;
        gap: 16px;
        font-size: 0.8rem;
        color: var(--text-dim);
    }

    .notice-meta span {
        display: flex;
        align-items: center;
        gap: 4px;
    }

    .notice-views {
        flex-shrink: 0;
        color: var(--text-dim);
        font-size: 0.85rem;
    }

    .empty-state {
        padding: 48px 20px;
        text-align: center;
        color: var(--text-dim);
    }

    .empty-state svg {
        width: 48px;
        height: 48px;
        margin-bottom: 16px;
        opacity: 0.5;
    }

    /* Pagination */
    .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin-top: 24px;
    }

    .pagination button {
        padding: 8px 16px;
        border: 1px solid var(--border-color);
        background: white;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: all 0.2s;
    }

    .pagination button:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
    }

    .pagination button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .pagination .page-info {
        font-size: 0.9rem;
        color: var(--text-sub);
        padding: 0 16px;
    }

    .loading {
        text-align: center;
        padding: 48px 20px;
        color: var(--text-dim);
    }
</style>
{% endblock %}

{% block content %}
<div class="notices-container">
    <div class="notices-header">
        <h1>📢 공지사항</h1>
        <form class="search-box" id="searchForm">
            <input type="text" id="searchInput" placeholder="공지사항 검색..." value="{{ search or '' }}">
            <button type="submit">검색</button>
        </form>
    </div>

    <div class="notice-list" id="noticeList">
        <div class="loading">공지사항을 불러오는 중...</div>
    </div>

    <div class="pagination" id="pagination" style="display: none;">
        <button id="prevBtn">이전</button>
        <span class="page-info" id="pageInfo"></span>
        <button id="nextBtn">다음</button>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
let currentPage = 1;
let totalPages = 1;
const pageSize = 10;
let searchQuery = new URLSearchParams(window.location.search).get('search') || '';

document.getElementById('searchInput').value = searchQuery;

async function loadNotices() {
    const listEl = document.getElementById('noticeList');
    listEl.innerHTML = '<div class="loading">공지사항을 불러오는 중...</div>';
    
    try {
        let url = `/api/v1/notices?page=${currentPage}&page_size=${pageSize}`;
        if (searchQuery) {
            url += `&search=${encodeURIComponent(searchQuery)}`;
        }
        
        const response = await fetch(url);
        const data = await response.json();
        
        renderNotices(data);
        updatePagination(data);
    } catch (error) {
        listEl.innerHTML = '<div class="empty-state">공지사항을 불러오는데 실패했습니다.</div>';
    }
}

function renderNotices(data) {
    const listEl = document.getElementById('noticeList');
    const allNotices = [...data.pinned_notices, ...data.notices];
    
    if (allNotices.length === 0) {
        listEl.innerHTML = `
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                </svg>
                <p>${searchQuery ? '검색 결과가 없습니다.' : '등록된 공지사항이 없습니다.'}</p>
            </div>
        `;
        return;
    }
    
    listEl.innerHTML = allNotices.map(notice => `
        <div class="notice-item ${notice.is_pinned ? 'pinned' : ''}">
            ${notice.is_pinned ? '<span class="pin-badge">📌 고정</span>' : ''}
            <div class="notice-content">
                <a href="/notices/${notice.id}" class="notice-title">${escapeHtml(notice.title)}</a>
                <div class="notice-meta">
                    <span>${formatDate(notice.created_at)}</span>
                </div>
            </div>
            <span class="notice-views">조회 ${notice.view_count}</span>
        </div>
    `).join('');
}

function updatePagination(data) {
    const paginationEl = document.getElementById('pagination');
    const pageInfoEl = document.getElementById('pageInfo');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    
    totalPages = data.total_pages;
    
    if (data.total > 0 || data.pinned_notices.length > 0) {
        paginationEl.style.display = 'flex';
        pageInfoEl.textContent = `${currentPage} / ${totalPages}`;
        prevBtn.disabled = currentPage <= 1;
        nextBtn.disabled = currentPage >= totalPages;
    } else {
        paginationEl.style.display = 'none';
    }
}

function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

document.getElementById('searchForm').addEventListener('submit', (e) => {
    e.preventDefault();
    searchQuery = document.getElementById('searchInput').value.trim();
    currentPage = 1;
    
    const url = new URL(window.location);
    if (searchQuery) {
        url.searchParams.set('search', searchQuery);
    } else {
        url.searchParams.delete('search');
    }
    window.history.pushState({}, '', url);
    
    loadNotices();
});

document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentPage > 1) {
        currentPage--;
        loadNotices();
    }
});

document.getElementById('nextBtn').addEventListener('click', () => {
    if (currentPage < totalPages) {
        currentPage++;
        loadNotices();
    }
});

// 초기 로드
loadNotices();
</script>
{% endblock %}
