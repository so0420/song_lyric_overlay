{% extends "admin/base.html" %}

{% block admin_content %}
<div class="admin-header">
    <h1>{{ '공지 수정' if notice else '새 공지 작성' }}</h1>
</div>

<style>
    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--text-main);
    }

    .form-group input[type="text"],
    .form-group textarea {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 1rem;
        font-family: inherit;
    }

    .form-group textarea {
        min-height: 300px;
        resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.1);
    }

    .checkbox-group {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
    }

    .checkbox-item {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .checkbox-item input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
    }

    .form-actions {
        display: flex;
        gap: 12px;
        margin-top: 24px;
    }

    .btn-secondary {
        background: white;
        border: 1px solid var(--border-color);
        color: var(--text-main);
        padding: 12px 24px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
    }

    .btn-secondary:hover {
        background: #f1f5f9;
    }
</style>

<form id="noticeForm">
    <div class="form-group">
        <label for="title">제목</label>
        <input type="text" id="title" name="title" required value="{{ notice.title if notice else '' }}" placeholder="공지 제목을 입력하세요">
    </div>

    <div class="form-group">
        <label for="content">내용</label>
        <textarea id="content" name="content" required placeholder="공지 내용을 입력하세요">{{ notice.content if notice else '' }}</textarea>
    </div>

    <div class="form-group">
        <label>옵션</label>
        <div class="checkbox-group">
            <label class="checkbox-item">
                <input type="checkbox" id="is_pinned" name="is_pinned" {{ 'checked' if notice and notice.is_pinned else '' }}>
                📌 고정 공지
            </label>
            <label class="checkbox-item">
                <input type="checkbox" id="is_published" name="is_published" {{ 'checked' if (not notice) or notice.is_published else '' }}>
                🌐 게시 (체크 해제 시 비공개)
            </label>
        </div>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">{{ '수정 완료' if notice else '공지 등록' }}</button>
        <a href="/admin/notices" class="btn-secondary">취소</a>
    </div>
</form>

<script>
document.getElementById('noticeForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const data = {
        title: document.getElementById('title').value,
        content: document.getElementById('content').value,
        is_pinned: document.getElementById('is_pinned').checked,
        is_published: document.getElementById('is_published').checked
    };
    
    const noticeId = {{ notice.id if notice else 'null' }};
    const url = noticeId ? `/api/v1/admin/notices/${noticeId}` : '/api/v1/admin/notices';
    const method = noticeId ? 'PUT' : 'POST';
    
    try {
        const response = await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        
        if (response.ok) {
            window.location.href = '/admin/notices';
        } else {
            const err = await response.json();
            alert(err.detail || '저장 실패');
        }
    } catch (error) {
        alert('저장 중 오류가 발생했습니다.');
    }
});
</script>
{% endblock %}
