<!-- 사이드바 컴포넌트 -->
<aside class="sidebar" id="sidebar">
    <!-- 로고 영역 -->
    <div class="sidebar-brand">
        <a href="/" class="brand-link">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" class="brand-icon"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            <span class="brand-text brand-font">Jamku Song</span>
        </a>
        <button class="sidebar-close" id="sidebarClose" aria-label="사이드바 닫기">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
    </div>

    <!-- 메인 네비게이션 -->
    <nav class="sidebar-nav">
        <a href="/" class="nav-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            홈
        </a>
        <a href="/overlay" class="nav-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            노래하기
        </a>
        <a href="/overlay/settings" class="nav-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            OBS 오버레이 설정
        </a>
        <a href="/lyrics" class="nav-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            가사 편집기
        </a>
        {% if user and user.is_admin %}
        <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-color);">
            <span style="font-size: 0.7rem; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; padding: 0 16px;">관리자</span>
        </div>
        <a href="/admin" class="nav-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
            관리자 대시보드
        </a>
        <a href="/admin/websocket" class="nav-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            WebSocket 모니터링
        </a>
        {% endif %}
    </nav>

    <!-- 내 가사 섹션 -->
    {% if user %}
    <div class="sidebar-section" style="flex: 1;">
        <div class="section-header">
            <span class="section-title">내 가사</span>
            <a href="/mypage" class="section-link">더보기</a>
        </div>
        <div id="sidebarLyricsList" class="lyrics-list">
            <div class="sidebar-loading">로딩 중...</div>
        </div>
    </div>
    {% else %}
    <div class="sidebar-section" style="flex: 1;">
        <div class="section-header">
            <span class="section-title">내 가사</span>
        </div>
        <div class="sidebar-login-prompt">
            <p>로그인하여 가사를 만들어보세요</p>
        </div>
    </div>
    {% endif %}

    <!-- 사용자 프로필 (하단 고정) -->
    <div class="sidebar-footer">
        {% if user %}
        <div class="user-profile-mini">
            <div class="user-info-mini">
                <div class="user-name">{{ user.name }}</div>
                <a href="/api/v1/oauth/logout" class="user-logout">로그아웃</a>
            </div>
            <a href="/mypage" class="btn-icon-mini" title="마이페이지">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </a>
        </div>
        {% else %}
        <a href="/login" class="btn btn-primary" style="width: 100%; justify-content: center;">
            로그인 / 가입
        </a>
        {% endif %}
    </div>
</aside>

<!-- 사이드바 오버레이 (모바일) -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<style>
.sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 260px;
    height: 100vh;
    background: #f8fafc;
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    z-index: 1001;
    transition: transform 0.3s ease;
}

.sidebar-brand {
    height: var(--header-height);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    border-bottom: 1px solid var(--border-color);
}

.brand-link {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--text-main);
    text-decoration: none;
}

.brand-icon {
    color: var(--accent);
}

.sidebar-close {
    display: none;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-sub);
}

.sidebar-nav {
    padding: 24px 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 8px;
    color: var(--text-sub);
    font-weight: 600;
    font-size: 0.95rem;
    transition: all 0.2s;
}

.nav-item:hover {
    background: white;
    color: var(--accent);
    box-shadow: var(--shadow-sm);
}

.nav-item svg {
    opacity: 0.8;
}

.sidebar-section {
    padding: 16px 24px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.section-title {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.section-link {
    font-size: 0.75rem;
    color: var(--accent);
}

/* User Profile Footer */
.sidebar-footer {
    padding: 20px;
    border-top: 1px solid var(--border-color);
    background: white;
}

.user-profile-mini {
    display: flex;
    align-items: center;
    gap: 12px;
}

.user-info-mini {
    flex: 1;
    overflow: hidden;
}

.user-name {
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.user-logout {
    font-size: 0.75rem;
    color: var(--text-sub);
    display: block;
}

.btn-icon-mini {
    color: var(--text-dim);
    padding: 8px;
    border-radius: 6px;
    transition: all 0.2s;
}

.btn-icon-mini:hover {
    background: var(--bg-body);
    color: var(--text-main);
}

/* Lyrics List */
.lyrics-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 300px;
    overflow-y: auto;
}

.lyrics-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: white;
    border-radius: 8px;
    color: var(--text-main);
    font-weight: 500;
    font-size: 0.85rem;
    text-decoration: none;
    transition: all 0.2s;
    border: 1px solid var(--border-color);
}

.lyrics-item:hover {
    border-color: var(--accent);
    background: var(--accent-light);
}

.lyrics-item-info {
    flex: 1;
    min-width: 0;
}

.lyrics-item-title {
    font-weight: 600;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.lyrics-item-song {
    font-size: 0.8rem;
    color: var(--text-sub);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Sidebar Empty States */
.sidebar-empty, .sidebar-loading {
    padding: 24px 0;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.9rem;
}

.sidebar-login-prompt {
    text-align: center;
    padding: 16px 0;
}

.sidebar-login-prompt p {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 0;
}

/* Mobile */
@media (max-width: 1024px) {
    .sidebar {
        transform: translateX(-100%);
    }
    .sidebar.open {
        transform: translateX(0);
    }
    .sidebar-close {
        display: block;
    }
    .sidebar-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.5);
        z-index: 1000;
    }
    .sidebar-overlay.open {
        display: block;
    }
}
</style>

<script>
// 사이드바 토글
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    sidebar.classList.toggle('open');
    overlay.classList.toggle('open');
}

document.getElementById('sidebarClose')?.addEventListener('click', toggleSidebar);
document.getElementById('sidebarOverlay')?.addEventListener('click', toggleSidebar);

// 사이드바 내 가사 목록 로드
async function loadSidebarLyrics() {
    const container = document.getElementById('sidebarLyricsList');
    if (!container) return;

    try {
        const res = await fetch('/api/v1/lyrics/my');
        if (!res.ok) {
            container.innerHTML = '<div class="sidebar-empty">로드 실패</div>';
            return;
        }

        const lyrics = await res.json();

        if (lyrics.length === 0) {
            container.innerHTML = '<div class="sidebar-empty">등록된 가사가 없습니다</div>';
            return;
        }

        // 최대 5개만 표시
        const displayLyrics = lyrics.slice(0, 5);
        container.innerHTML = displayLyrics.map(l => `
            <a href="/lyrics?lyrics_id=${l.id}" class="lyrics-item">
                <div class="lyrics-item-info">
                    <div class="lyrics-item-title">${sidebarEscapeHtml(l.title || '제목 없음')}</div>
                    <div class="lyrics-item-song">${sidebarEscapeHtml(l.song_title)} - ${sidebarEscapeHtml(l.artist_name || '')}</div>
                </div>
            </a>
        `).join('');
    } catch (e) {
        container.innerHTML = '<div class="sidebar-empty">로드 실패</div>';
    }
}

function sidebarEscapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// 초기화
document.addEventListener('DOMContentLoaded', () => {
    {% if user %}
    loadSidebarLyrics();
    {% endif %}
});
</script>
