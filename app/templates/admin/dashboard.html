{% extends "admin/base.html" %}

{% block admin_content %}
<div class="admin-header">
    <h1>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="margin-right: 8px; vertical-align: bottom;"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        대시보드
    </h1>
</div>

<style>
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 32px;
    }

    .stat-card {
        background: white;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        transition: all 0.2s;
    }
    
    .stat-card:hover {
        border-color: var(--accent);
        box-shadow: var(--shadow-sm);
    }

    .stat-card .stat-value {
        font-size: 2rem;
        font-weight: 700;
        color: var(--accent);
        margin-bottom: 4px;
    }

    .stat-card .stat-label {
        font-size: 0.9rem;
        color: var(--text-sub);
    }

    .welcome-box {
        background: var(--bg-body);
        border-radius: 12px;
        padding: 32px;
        text-align: center;
        border: 1px solid var(--border-color);
    }

    .welcome-box h2 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
    }

    .welcome-box p {
        color: var(--text-sub);
        margin: 0;
        font-size: 1rem;
    }
</style>

<div class="welcome-box">
    <h2>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>
        안녕하세요, {{ user.name }}님!
    </h2>
    <p>PlayList 관리자 페이지입니다. 좌측 메뉴에서 관리할 항목을 선택하세요.</p>
</div>
{% endblock %}
