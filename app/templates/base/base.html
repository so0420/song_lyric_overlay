<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token(request) }}">
    <title>{% block title %}Jamku Song - 가사 자막 오버레이{% endblock %}</title>
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #ffffff;
            --bg-card: #ffffff;
            --accent: #2563eb; /* Royal Blue */
            --accent-hover: #1d4ed8;
            --accent-light: #eff6ff;
            --text-main: #0f172a;
            --text-sub: #475569;
            --text-dim: #94a3b8;
            --border-color: #e2e8f0;
            --sidebar-width: 260px;
            --header-height: 60px; /* Mobile only */
            --star-color: #f59e0b;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4 {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-main);
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding-left: 24px;
            padding-right: 24px;
        }

        /* Mobile Header (Hidden on Desktop) */
        .mobile-header {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-height);
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .mobile-logo {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hamburger-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            color: var(--text-main);
            border-radius: 6px;
        }

        /* Layout */
        .page-wrapper {
            display: flex;
            min-height: 100vh;
        }

        main {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 40px 32px 80px;
            background-color: white; /* Main content white */
            min-height: 100vh;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .mobile-header {
                display: flex;
            }

            main {
                margin-left: 0;
                padding: calc(var(--header-height) + 24px) 16px 64px;
            }
        }

        /* Buttons & Utilities */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
            font-size: 0.9rem;
            gap: 8px;
            user-select: none; /* Prevent text selection on double click */
        }

        .btn:active {
            transform: scale(0.96); /* Tactile feedback */
        }

        .btn-primary {
            background-color: var(--accent);
            color: white;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-outline {
            background-color: white;
            border-color: var(--border-color);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background-color: #f8fafc;
            border-color: var(--text-dim);
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
        }

        .brand-font {
            font-family: 'Lexend', sans-serif;
            font-weight: 500;
        }

    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <!-- Mobile Header -->
    <header class="mobile-header">
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="메뉴 열기">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        <a href="/" class="mobile-logo brand-font">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="color: var(--accent);"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
            Jamku Song
        </a>
        <div style="width: 40px;"></div> <!-- Spacer -->
    </header>

    <div class="page-wrapper">
        {% include "partials/_sidebar.html" %}
        
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        // 햄버거 메뉴 토글
        document.getElementById('hamburgerBtn')?.addEventListener('click', function() {
            // 사이드바 토글 함수 호출 (sidebar.html에 정의됨)
            if (typeof toggleSidebar === 'function') {
                toggleSidebar();
            }
        });
    </script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
