[package]
name = "video_maker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "video_maker"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
rfd = "0.15"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
zstd = "0.13"
anyhow = "1"
dirs = "5"

[build-dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
