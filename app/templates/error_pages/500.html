{% extends "base/base.html" %}

{% block title %}500 - 서버 오류가 발생했습니다{% endblock %}

{% block extra_styles %}
<style>
.error-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - var(--header-height) - 160px);
    text-align: center;
    padding-bottom: 80px;
}

.error-code {
    font-size: 10rem;
    font-weight: 800;
    line-height: 1;
    margin: 0;
    font-family: 'Outfit', sans-serif;
    background: linear-gradient(135deg, var(--accent) 0%, #c084fc 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 10px 20px rgba(147, 51, 234, 0.1));
    animation: pulse 4s ease-in-out infinite;
}

.error-message {
    font-size: 2rem;
    font-weight: 700;
    margin: 24px 0 16px;
    color: var(--text-main);
}

.error-description {
    color: var(--text-sub);
    max-width: 520px;
    margin-bottom: 40px;
    font-size: 1.1rem;
    line-height: 1.6;
}

.btn-group {
    display: flex;
    gap: 12px;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.98); opacity: 0.8; }
}

.decoration {
    position: absolute;
    z-index: -1;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.12;
}

.decoration-1 {
    width: 350px;
    height: 350px;
    background: var(--accent);
    top: 15%;
    right: 10%;
}

.decoration-2 {
    width: 300px;
    height: 300px;
    background: #f472b6;
    bottom: 15%;
    left: 10%;
}
</style>
{% endblock %}

{% block content %}
<div class="error-container">
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>
    
    <h1 class="error-code">500</h1>
    <h2 class="error-message">앗! 서버에 문제가 생겼어요</h2>
    <p class="error-description">
        요청을 처리하는 도중 예기치 못한 오류가 발생했습니다.<br>
        잠시 후 다시 시도해 주시거나, 계속되면 관리자에게 문의해 주세요.
    </p>
    
    <div class="btn-group">
        <a href="javascript:location.reload()" class="btn btn-outline">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
            새로고침
        </a>
        <a href="/" class="btn btn-primary">
            메인으로 돌아가기
        </a>
    </div>
</div>
{% endblock %}
