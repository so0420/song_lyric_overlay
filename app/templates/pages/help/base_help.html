{% extends "base/base.html" %}

{% block extra_styles %}
<style>
.help-container {
    max-width: 860px;
    margin: 0 auto;
    padding-top: 40px;
}

.help-header {
    margin-bottom: 40px;
}

.help-breadcrumb {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 12px;
}

.help-breadcrumb a {
    color: var(--accent);
    text-decoration: none;
}

.help-breadcrumb a:hover { text-decoration: underline; }

.help-title {
    font-size: 2rem;
    font-weight: 800;
    color: var(--text-main);
    margin-bottom: 8px;
}

.help-subtitle {
    color: var(--text-sub);
    font-size: 1rem;
}

.help-toc {
    background: #f8fafc;
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 24px 32px;
    margin-bottom: 48px;
}

.help-toc-title {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
}

.help-toc-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px;
}

.help-toc-list a {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
    border-radius: 8px;
    transition: background 0.2s;
}

.help-toc-list a:hover { background: var(--accent-light); }

.help-section {
    margin-bottom: 48px;
}

.help-section-title {
    font-size: 1.3rem;
    font-weight: 800;
    color: var(--text-main);
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
}

.help-section-title svg {
    color: var(--accent);
    flex-shrink: 0;
}

.help-card {
    background: white;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 16px;
}

.help-card h4 {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 8px;
}

.help-card p, .help-card li {
    font-size: 0.9rem;
    color: var(--text-sub);
    line-height: 1.7;
}

.help-card ol, .help-card ul {
    padding-left: 20px;
    margin: 8px 0 0;
}

.help-card ol li, .help-card ul li {
    margin-bottom: 6px;
}

.help-steps {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.help-step {
    display: flex;
    gap: 16px;
    align-items: flex-start;
}

.help-step-num {
    width: 28px;
    height: 28px;
    background: var(--accent);
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 2px;
}

.help-step-content { flex: 1; }

.help-step-content h4 {
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 4px;
}

.help-step-content p {
    font-size: 0.9rem;
    color: var(--text-sub);
    line-height: 1.6;
}

.kbd {
    background: #f1f5f9;
    padding: 2px 8px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 0.8rem;
    border: 1px solid #e2e8f0;
}

.help-tip {
    background: #eff6ff;
    border-left: 4px solid var(--accent);
    padding: 12px 16px;
    border-radius: 0 8px 8px 0;
    margin: 12px 0;
    font-size: 0.88rem;
    color: var(--text-sub);
    line-height: 1.6;
}

.help-tip b { color: var(--accent); }

.help-warn {
    background: #fef3c7;
    border-left: 4px solid #f59e0b;
    padding: 12px 16px;
    border-radius: 0 8px 8px 0;
    margin: 12px 0;
    font-size: 0.88rem;
    color: #92400e;
    line-height: 1.6;
}

.help-code {
    background: #f3f4f6;
    padding: 4px 8px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 0.82rem;
}

.help-nav-bottom {
    display: flex;
    justify-content: space-between;
    padding-top: 24px;
    border-top: 1px solid var(--border-color);
    margin-top: 48px;
}

.help-nav-link {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    gap: 6px;
}

.help-nav-link:hover { text-decoration: underline; }

.shortcuts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.shortcut-group h4 {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 8px;
}

.shortcut-group table {
    width: 100%;
    border-collapse: collapse;
}

.shortcut-group td {
    padding: 4px 0;
    font-size: 0.85rem;
    color: var(--text-sub);
}

.shortcut-group td:first-child { width: 140px; }

/* Hub cards */
.help-hub-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 16px;
    margin-bottom: 48px;
}

.help-hub-card {
    display: block;
    background: white;
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 24px;
    text-decoration: none;
    transition: all 0.2s;
}

.help-hub-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px -8px rgba(37, 99, 235, 0.15);
}

.help-hub-card-icon {
    width: 48px;
    height: 48px;
    background: var(--accent-light);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    margin-bottom: 16px;
}

.help-hub-card-title {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 6px;
}

.help-hub-card-desc {
    font-size: 0.85rem;
    color: var(--text-sub);
    line-height: 1.5;
}

@media (max-width: 640px) {
    .shortcuts-grid { grid-template-columns: 1fr; }
    .help-toc-list { grid-template-columns: 1fr; }
    .help-hub-grid { grid-template-columns: 1fr; }
}
</style>
{% block help_styles %}{% endblock %}
{% endblock %}
