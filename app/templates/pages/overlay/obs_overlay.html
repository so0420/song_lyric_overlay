<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가사 오버레이</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Nanum+Gothic:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Pretendard';
            src: url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
        }

        .overlay-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* 상단 좌측 - 노래 정보 */
        .song-info-box {
            position: absolute;
            top: 40px;
            left: 40px;
            opacity: 0;
            transform: translateX(-20px);
            transition: all 0.4s ease;
        }

        .song-info-box.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .now-badge {
            display: inline-block;
            background: #1a1a1a;
            color: #FFE500;
            font-size: 14px;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .song-title-row {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }

        .song-title {
            font-size: 48px;
            font-weight: 800;
            color: #FFFFFF;
            -webkit-text-stroke: 3px #000000;
            paint-order: stroke fill;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
            line-height: 1.2;
        }

        .artist-name {
            font-size: 28px;
            font-weight: 600;
            color: #FFFFFF;
            -webkit-text-stroke: 3px #000000;
            paint-order: stroke fill;
            text-shadow: 0 4px 8px rgba(0,0,0,0.5);
            opacity: 0.9;
        }

        /* 하단 중앙 - 가사 */
        .lyrics-box {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            width: 90%;
            max-width: 1200px;
        }

        .lyrics-line {
            font-size: 52px;
            font-weight: 800;
            color: #FFFFFF;
            line-height: 1.4;
            margin: 8px 0;
            -webkit-text-stroke: 3px #000000;
            paint-order: stroke fill;
            text-shadow: 0 6px 12px rgba(0,0,0,0.6);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        .lyrics-line.no-animation {
            transition: none;
        }

        .lyrics-line.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .lyrics-line.highlight {
            color: #FFE500;
        }

        .lyrics-line.sub {
            font-size: 36px;
            opacity: 0.6;
        }

        /* 연결 상태 */
        .connection-status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .connection-status.disconnected {
            background: rgba(239, 68, 68, 0.9);
            color: white;
            opacity: 1;
        }

        .connection-status.connecting {
            background: rgba(245, 158, 11, 0.9);
            color: white;
            opacity: 1;
        }

        /* 대기 메시지 */
        .idle-message {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 24px;
            display: none;
        }

        .idle-message.visible {
            display: block;
        }

        /* 재생목록 */
        .playlist-box {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 280px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 16px;
            padding: 16px;
            opacity: 0;
            transition: all 0.4s ease;
        }

        .playlist-box.visible {
            opacity: 1;
        }

        .playlist-box.left {
            left: 40px;
        }

        .playlist-box.right {
            right: 40px;
        }

        .playlist-header {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: 600;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .playlist-header svg {
            opacity: 0.7;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            margin-bottom: 6px;
            transition: all 0.2s ease;
        }

        .playlist-item:last-child {
            margin-bottom: 0;
        }

        .playlist-item.active {
            background: rgba(255, 255, 255, 0.1);
        }

        .playlist-item-number {
            width: 20px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
        }

        .playlist-item.active .playlist-item-number {
            color: #FFE500;
        }

        .playlist-item-thumb {
            width: 48px;
            height: 36px;
            border-radius: 6px;
            object-fit: cover;
            background: linear-gradient(135deg, #667eea, #764ba2);
            flex-shrink: 0;
        }

        .playlist-item-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .playlist-item-title {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-item.active .playlist-item-title {
            color: #FFE500;
        }

        .playlist-item-artist {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 애니메이션 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.4s ease forwards;
        }
    </style>
</head>
<body>
    <div class="overlay-wrapper">
        <!-- 상단 좌측: 노래 정보 -->
        <div class="song-info-box" id="songInfoBox">
            <div class="now-badge">NOW</div>
            <div class="song-title-row">
                <span class="song-title" id="songTitle"></span>
                <span class="artist-name" id="artistName"></span>
            </div>
        </div>

        <!-- 하단 중앙: 가사 -->
        <div class="lyrics-box" id="lyricsBox">
            <p class="lyrics-line sub" id="prevLine"></p>
            <p class="lyrics-line highlight" id="currentLine"></p>
            <p class="lyrics-line sub" id="nextLine"></p>
        </div>

        <!-- 대기 메시지 
        <p class="idle-message visible" id="idleMessage">노래하기 페이지에서 재생을 시작하세요</p>-->

        <!-- 재생목록 -->
        <div class="playlist-box right" id="playlistBox">
            <div class="playlist-header">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
                재생목록
            </div>
            <div class="playlist-items" id="playlistItems"></div>
        </div>
    </div>

    <div class="connection-status" id="connectionStatus">연결 중...</div>

    <script>
        const userId = {{ user_id }};
        const overlayToken = {{ overlay_token | tojson if overlay_token else 'null' }};
        const initialSettings = {{ settings | tojson if settings else 'null' }};

        // Default settings
        const defaultSettings = {
            font_family: "Pretendard",
            font_size: 52,
            font_color: "#FFFFFF",
            highlight_color: "#FFE500",
            current_line_weight: 800,
            prev_line_weight: 600,
            next_line_weight: 600,
            song_title_weight: 800,
            artist_weight: 600,
            text_stroke: true,
            stroke_color: "#000000",
            current_line_stroke: 3,
            prev_line_stroke: 2,
            next_line_stroke: 2,
            song_title_stroke: 3,
            artist_stroke: 2,
            text_shadow: true,
            animation_enabled: false,
            show_prev_line: true,
            show_next_line: true,
            show_song_title: true,
            show_artist: true,
            show_now_badge: true,
            song_title_size: 48,
            artist_size: 28,
            lyrics_position: "bottom",
            song_info_position: "top-left",
            // 재생목록 설정
            show_playlist: false,
            playlist_position: "right",
            playlist_max_items: 5,
            playlist_font_size: 16,
            playlist_bg_color: "#000000",
            playlist_bg_opacity: 0.7,
            playlist_text_color: "#FFFFFF",
            playlist_highlight_color: "#FFE500",
            playlist_show_thumbnail: true,
            playlist_show_artist: true
        };

        let settings = { ...defaultSettings, ...initialSettings };
        let ws = null;
        let reconnectTimeout = null;
        let currentSongTitle = '';
        let currentArtist = '';

        const songInfoBox = document.getElementById('songInfoBox');
        const songTitleEl = document.getElementById('songTitle');
        const artistNameEl = document.getElementById('artistName');
        const lyricsBox = document.getElementById('lyricsBox');
        const prevLine = document.getElementById('prevLine');
        const currentLine = document.getElementById('currentLine');
        const nextLine = document.getElementById('nextLine');
        const idleMessage = document.getElementById('idleMessage');
        const connectionStatus = document.getElementById('connectionStatus');
        const nowBadge = document.querySelector('.now-badge');
        const playlistBox = document.getElementById('playlistBox');
        const playlistItems = document.getElementById('playlistItems');

        let currentPlaylist = [];
        let currentPlayingIndex = -1;

        // 시간 기반 가사 동기화 상태
        let lyricsData = null;        // 전체 가사 배열
        let syncTime = 0;             // 마지막 수신 시간 (ms)
        let syncReceivedAt = 0;       // performance.now() 수신 시점
        let isPlaying = false;        // 재생 상태
        let lastRenderedIndex = -2;   // 마지막 렌더링 인덱스
        let renderAnimFrameId = null; // requestAnimationFrame ID

        function applySettings(s) {
            settings = { ...defaultSettings, ...s };

            // Song title styles
            songTitleEl.style.fontSize = settings.song_title_size + 'px';
            songTitleEl.style.fontWeight = settings.song_title_weight || 800;
            artistNameEl.style.fontSize = settings.artist_size + 'px';
            artistNameEl.style.fontWeight = settings.artist_weight || 600;

            // Lyrics styles - 각 요소별 굵기 적용
            currentLine.style.fontSize = settings.font_size + 'px';
            currentLine.style.fontWeight = settings.current_line_weight || 800;
            currentLine.style.color = settings.highlight_color || '#FFE500';

            prevLine.style.fontSize = (settings.font_size * 0.7) + 'px';
            prevLine.style.fontWeight = settings.prev_line_weight || 600;

            nextLine.style.fontSize = (settings.font_size * 0.7) + 'px';
            nextLine.style.fontWeight = settings.next_line_weight || 600;

            // Text stroke using -webkit-text-stroke (요소별 두께 적용)
            const sc = settings.stroke_color || '#000000';
            const shadowStyle = settings.text_shadow ? '0 6px 12px rgba(0,0,0,0.6)' : 'none';

            if (settings.text_stroke) {
                currentLine.style.webkitTextStroke = `${settings.current_line_stroke || 3}px ${sc}`;
                prevLine.style.webkitTextStroke = `${settings.prev_line_stroke || 2}px ${sc}`;
                nextLine.style.webkitTextStroke = `${settings.next_line_stroke || 2}px ${sc}`;
                songTitleEl.style.webkitTextStroke = `${settings.song_title_stroke || 3}px ${sc}`;
                artistNameEl.style.webkitTextStroke = `${settings.artist_stroke || 2}px ${sc}`;
            } else {
                [currentLine, prevLine, nextLine, songTitleEl, artistNameEl].forEach(el => {
                    el.style.webkitTextStroke = '0px';
                });
            }

            // Apply paint-order and shadow to all text elements
            [currentLine, prevLine, nextLine, songTitleEl, artistNameEl].forEach(el => {
                el.style.paintOrder = 'stroke fill';
                el.style.textShadow = shadowStyle;
            });

            // 애니메이션 비활성화 시 CSS transition 제거
            [prevLine, currentLine, nextLine].forEach(el => {
                el.classList.toggle('no-animation', !settings.animation_enabled);
            });

            // Show/hide elements
            prevLine.style.display = settings.show_prev_line ? 'block' : 'none';
            nextLine.style.display = settings.show_next_line ? 'block' : 'none';
            nowBadge.style.display = settings.show_now_badge ? 'inline-block' : 'none';

            // Song info position
            applySongInfoPosition(settings.song_info_position || 'top-left');

            updateSongInfoDisplay();

            // 재생목록 설정 적용
            applyPlaylistSettings();
        }

        function applyPlaylistSettings() {
            if (!settings.show_playlist) {
                playlistBox.classList.remove('visible');
                return;
            }

            // 위치 설정
            playlistBox.classList.remove('left', 'right');
            playlistBox.classList.add(settings.playlist_position || 'right');

            // 배경 색상 및 투명도
            const bgColor = settings.playlist_bg_color || '#000000';
            const r = parseInt(bgColor.slice(1, 3), 16);
            const g = parseInt(bgColor.slice(3, 5), 16);
            const b = parseInt(bgColor.slice(5, 7), 16);
            playlistBox.style.background = `rgba(${r}, ${g}, ${b}, ${settings.playlist_bg_opacity || 0.7})`;

            // 폰트 크기
            playlistBox.style.fontSize = (settings.playlist_font_size || 16) + 'px';

            // 재생목록 렌더링
            renderPlaylist();
        }

        function renderPlaylist() {
            if (!settings.show_playlist || currentPlaylist.length === 0) {
                playlistBox.classList.remove('visible');
                return;
            }

            const maxItems = settings.playlist_max_items || 5;
            let startIndex = 0;

            // 현재 재생 중인 곡이 보이도록 스크롤 조정
            if (currentPlayingIndex >= 0) {
                startIndex = Math.max(0, currentPlayingIndex - Math.floor(maxItems / 2));
                if (startIndex + maxItems > currentPlaylist.length) {
                    startIndex = Math.max(0, currentPlaylist.length - maxItems);
                }
            }

            const visibleItems = currentPlaylist.slice(startIndex, startIndex + maxItems);

            playlistItems.innerHTML = visibleItems.map((item, idx) => {
                const actualIndex = startIndex + idx;
                const isActive = actualIndex === currentPlayingIndex;
                const videoId = item.videoId || item.mr_youtube_video_id || '';
                const title = item.songTitle || item.song_title || '';
                const artist = item.artistName || item.artist_name || '';

                return `
                    <div class="playlist-item ${isActive ? 'active' : ''}">
                        <span class="playlist-item-number" style="color: ${isActive ? (settings.playlist_highlight_color || '#FFE500') : 'rgba(255,255,255,0.5)'}">
                            ${actualIndex + 1}
                        </span>
                        ${settings.playlist_show_thumbnail ? `
                            <img class="playlist-item-thumb"
                                 src="https://img.youtube.com/vi/${videoId}/default.jpg"
                                 alt=""
                                 onerror="this.style.background='linear-gradient(135deg,#667eea,#764ba2)';this.src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'">
                        ` : ''}
                        <div class="playlist-item-info">
                            <div class="playlist-item-title" style="color: ${isActive ? (settings.playlist_highlight_color || '#FFE500') : (settings.playlist_text_color || '#FFFFFF')}; font-size: ${settings.playlist_font_size || 16}px;">
                                ${escapeHtml(title)}
                            </div>
                            ${settings.playlist_show_artist && artist ? `
                                <div class="playlist-item-artist" style="color: ${settings.playlist_text_color || '#FFFFFF'}; font-size: ${(settings.playlist_font_size || 16) - 2}px;">
                                    ${escapeHtml(artist)}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }).join('');

            playlistBox.classList.add('visible');
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatLyrics(text) {
            if (!text) return '';
            return escapeHtml(text).replace(/\\n/g, '<br>').replace(/&lt;br&gt;/g, '<br>');
        }

        function applySongInfoPosition(position) {
            songInfoBox.style.top = '';
            songInfoBox.style.bottom = '';
            songInfoBox.style.left = '';
            songInfoBox.style.right = '';
            songInfoBox.style.transform = '';
            songInfoBox.style.textAlign = 'left';

            const padding = '40px';
            const bottomOffset = '140px'; // 가사 위에 표시되도록

            switch (position) {
                case 'top-left':
                    songInfoBox.style.top = padding;
                    songInfoBox.style.left = padding;
                    break;
                case 'top-center':
                    songInfoBox.style.top = padding;
                    songInfoBox.style.left = '50%';
                    songInfoBox.style.transform = 'translateX(-50%)';
                    songInfoBox.style.textAlign = 'center';
                    break;
                case 'top-right':
                    songInfoBox.style.top = padding;
                    songInfoBox.style.right = padding;
                    songInfoBox.style.textAlign = 'right';
                    break;
                case 'bottom-left':
                    songInfoBox.style.bottom = bottomOffset;
                    songInfoBox.style.left = padding;
                    break;
                case 'bottom-center':
                    songInfoBox.style.bottom = bottomOffset;
                    songInfoBox.style.left = '50%';
                    songInfoBox.style.transform = 'translateX(-50%)';
                    songInfoBox.style.textAlign = 'center';
                    break;
                case 'bottom-right':
                    songInfoBox.style.bottom = bottomOffset;
                    songInfoBox.style.right = padding;
                    songInfoBox.style.textAlign = 'right';
                    break;
            }
        }

        function updateSongInfoDisplay() {
            const showTitle = settings.show_song_title && currentSongTitle;
            const showArtist = settings.show_artist && currentArtist;

            if (!showTitle && !showArtist) {
                songInfoBox.classList.remove('visible');
                return;
            }

            songTitleEl.textContent = showTitle ? currentSongTitle : '';
            artistNameEl.textContent = showArtist ? `- ${currentArtist}` : '';
            songInfoBox.classList.add('visible');
        }

        // 시간으로 가사 인덱스 검색
        function findLyricsIndex(lyrics, time) {
            for (let i = 0; i < lyrics.length; i++) {
                if (time >= lyrics[i].start && time < lyrics[i].end) {
                    return i;
                }
            }
            return -1;
        }

        // 보간된 현재 시간 계산
        function getCurrentInterpolatedTime() {
            if (!isPlaying) return syncTime;
            return syncTime + (performance.now() - syncReceivedAt);
        }

        // prev/current/next 가사 렌더링
        function renderLyricsAtIndex(index) {
            if (index === -1) {
                // 가사 구간 밖
                prevLine.innerHTML = '';
                currentLine.innerHTML = '';
                nextLine.innerHTML = '';
                prevLine.classList.remove('visible');
                currentLine.classList.remove('visible');
                nextLine.classList.remove('visible');
                return;
            }

            const prev = lyricsData[index - 1];
            const curr = lyricsData[index];
            const next = lyricsData[index + 1];

            const formattedCurrent = formatLyrics(curr.text);
            if (settings.animation_enabled && currentLine.innerHTML !== formattedCurrent) {
                currentLine.classList.remove('visible');
                setTimeout(() => {
                    currentLine.innerHTML = formattedCurrent;
                    if (curr.text) currentLine.classList.add('visible');
                }, 150);
            } else {
                currentLine.innerHTML = formattedCurrent;
                if (curr.text) currentLine.classList.add('visible');
                else currentLine.classList.remove('visible');
            }

            prevLine.innerHTML = prev ? formatLyrics(prev.text) : '';
            nextLine.innerHTML = next ? formatLyrics(next.text) : '';

            if (prev) prevLine.classList.add('visible');
            else prevLine.classList.remove('visible');

            if (next) nextLine.classList.add('visible');
            else nextLine.classList.remove('visible');
        }

        // requestAnimationFrame 기반 자체 렌더링 루프
        function renderLoop() {
            if (!lyricsData) return;

            const time = getCurrentInterpolatedTime();
            const index = findLyricsIndex(lyricsData, time);

            if (index !== lastRenderedIndex) {
                lastRenderedIndex = index;
                renderLyricsAtIndex(index);
            }

            renderAnimFrameId = requestAnimationFrame(renderLoop);
        }

        function startRenderLoop() {
            stopRenderLoop();
            renderAnimFrameId = requestAnimationFrame(renderLoop);
        }

        function stopRenderLoop() {
            if (renderAnimFrameId) {
                cancelAnimationFrame(renderAnimFrameId);
                renderAnimFrameId = null;
            }
        }

        // lyrics_init 메시지 처리
        function handleLyricsInit(data) {
            // 곡 정보 업데이트
            if (data.songTitle !== undefined) {
                currentSongTitle = data.songTitle || '';
            }
            if (data.artist !== undefined) {
                currentArtist = data.artist || '';
            }
            updateSongInfoDisplay();

            // 가사 데이터 저장
            lyricsData = data.lyrics || null;
            syncTime = data.currentTime || 0;
            syncReceivedAt = performance.now();
            isPlaying = data.isPlaying || false;
            lastRenderedIndex = -2;

            if (lyricsData && lyricsData.length > 0) {
                idleMessage.classList.remove('visible');
                startRenderLoop();
            } else {
                stopRenderLoop();
                // 가사 없으면 빈 상태
                prevLine.innerHTML = '';
                currentLine.innerHTML = '';
                nextLine.innerHTML = '';
                prevLine.classList.remove('visible');
                currentLine.classList.remove('visible');
                nextLine.classList.remove('visible');
            }
        }

        // lyrics_time_sync 메시지 처리
        function handleTimeSync(data) {
            syncTime = data.currentTime;
            syncReceivedAt = performance.now();

            const wasPlaying = isPlaying;
            isPlaying = data.isPlaying;

            if (isPlaying && !wasPlaying) {
                // 재개됨: 렌더링 루프 시작
                startRenderLoop();
            } else if (!isPlaying && wasPlaying) {
                // 일시정지됨: 마지막 위치에서 정지
                stopRenderLoop();
                if (lyricsData) {
                    const index = findLyricsIndex(lyricsData, syncTime);
                    if (index !== lastRenderedIndex) {
                        lastRenderedIndex = index;
                        renderLyricsAtIndex(index);
                    }
                }
            }
        }

        function clearLyrics() {
            stopRenderLoop();
            lyricsData = null;
            syncTime = 0;
            isPlaying = false;
            lastRenderedIndex = -2;

            prevLine.innerHTML = '';
            currentLine.innerHTML = '';
            nextLine.innerHTML = '';
            prevLine.classList.remove('visible');
            currentLine.classList.remove('visible');
            nextLine.classList.remove('visible');
            songInfoBox.classList.remove('visible');
            currentSongTitle = '';
            currentArtist = '';
            idleMessage.classList.add('visible');
        }

        function connect() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            // user_id는 토큰에 포함되어 있으므로 URL에 포함하지 않음
            let wsUrl = `${wsProtocol}//${window.location.host}/api/v1/overlay/ws`;

            // 오버레이 토큰 추가
            if (overlayToken) {
                wsUrl += `?overlay_token=${encodeURIComponent(overlayToken)}`;
            }

            connectionStatus.textContent = '연결 중...';
            connectionStatus.className = 'connection-status connecting';

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                connectionStatus.className = 'connection-status';
                console.log('WebSocket connected');
            };

            ws.onmessage = (event) => {
                try {
                    const message = JSON.parse(event.data);

                    switch (message.type) {
                        case 'ping':
                            // 서버 ping에 pong으로 응답
                            ws.send(JSON.stringify({ type: 'pong' }));
                            break;

                        case 'lyrics_init':
                            handleLyricsInit(message.data);
                            break;

                        case 'lyrics_time_sync':
                            handleTimeSync(message.data);
                            break;

                        case 'settings_update':
                            applySettings(message.settings);
                            break;

                        case 'clear':
                        case 'song_change':
                            clearLyrics();
                            break;

                        case 'playlist_update':
                            if (message.data) {
                                currentPlaylist = message.data.playlist || [];
                                currentPlayingIndex = message.data.currentIndex ?? -1;
                                renderPlaylist();
                            }
                            break;

                        case 'token_invalidated':
                            // 토큰 무효화 시 연결 종료 (재연결 하지 않음)
                            console.log('Token invalidated:', message.message);
                            ws.close();
                            break;
                    }
                } catch (e) {
                    console.error('Failed to parse message:', e);
                }
            };

            ws.onclose = () => {
                connectionStatus.textContent = '연결 끊김 - 재연결 중...';
                connectionStatus.className = 'connection-status disconnected';
                reconnectTimeout = setTimeout(connect, 3000);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                ws.close();
            };
        }

        // Initialize
        applySettings(settings);
        connect();
    </script>
</body>
</html>
