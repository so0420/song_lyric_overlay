{% extends "admin/base.html" %}

{% block admin_content %}
<div class="admin-header">
    <h1>📢 공지 관리</h1>
    <a href="/admin/notices/new" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        새 공지 작성
    </a>
</div>

<style>
    .notice-filters {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .notice-filters input {
        padding: 10px 16px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 0.9rem;
        flex: 1;
        min-width: 200px;
    }

    .notice-table {
        width: 100%;
        border-collapse: collapse;
    }

    .notice-table th,
    .notice-table td {
        padding: 12px 16px;
        text-align: left;
        border-bottom: 1px solid var(--border-color);
    }

    .notice-table th {
        background: #f8fafc;
        font-weight: 600;
        font-size: 0.85rem;
        color: var(--text-sub);
    }

    .notice-table tr:hover {
        background: #f8fafc;
    }

    .notice-table .title-cell {
        max-width: 300px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 0.75rem;
        font-weight: 600;
    }

    .badge-pinned {
        background: var(--accent);
        color: white;
    }

    .badge-published {
        background: #10b981;
        color: white;
    }

    .badge-draft {
        background: #6b7280;
        color: white;
    }

    .action-btns {
        display: flex;
        gap: 8px;
    }

    .action-btn {
        padding: 6px 12px;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        font-size: 0.8rem;
        cursor: pointer;
        background: white;
        transition: all 0.2s;
    }

    .action-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
    }

    .action-btn.delete:hover {
        border-color: #ef4444;
        color: #ef4444;
    }

    .empty-state {
        text-align: center;
        padding: 48px 20px;
        color: var(--text-dim);
    }

    .pagination {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 24px;
    }

    .pagination button {
        padding: 8px 16px;
        border: 1px solid var(--border-color);
        background: white;
        border-radius: 6px;
        cursor: pointer;
    }

    .pagination button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
</style>

<div class="notice-filters">
    <input type="text" id="searchInput" placeholder="공지 검색...">
</div>

<table class="notice-table">
    <thead>
        <tr>
            <th>ID</th>
            <th>제목</th>
            <th>상태</th>
            <th>조회수</th>
            <th>작성일</th>
            <th>관리</th>
        </tr>
    </thead>
    <tbody id="noticeTableBody">
        <tr><td colspan="6" class="empty-state">로딩 중...</td></tr>
    </tbody>
</table>

<div class="pagination" id="pagination" style="display: none;">
    <button id="prevBtn">이전</button>
    <span id="pageInfo"></span>
    <button id="nextBtn">다음</button>
</div>

<script>
let currentPage = 1;
let totalPages = 1;
const pageSize = 15;

async function loadNotices() {
    const search = document.getElementById('searchInput').value;
    const tbody = document.getElementById('noticeTableBody');
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">로딩 중...</td></tr>';
    
    try {
        let url = `/api/v1/admin/notices?page=${currentPage}&page_size=${pageSize}`;
        if (search) url += `&search=${encodeURIComponent(search)}`;
        
        const response = await fetch(url);
        const data = await response.json();
        
        renderNotices(data);
        updatePagination(data);
    } catch (error) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state">불러오기 실패</td></tr>';
    }
}

function renderNotices(data) {
    const tbody = document.getElementById('noticeTableBody');
    const notices = data.notices;
    
    if (!notices || notices.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state">등록된 공지가 없습니다.</td></tr>';
        return;
    }
    
    tbody.innerHTML = notices.map(n => `
        <tr>
            <td>${n.id}</td>
            <td class="title-cell">
                ${n.is_pinned ? '<span class="badge badge-pinned">고정</span> ' : ''}
                ${escapeHtml(n.title)}
            </td>
            <td>
                <span class="badge ${n.is_published ? 'badge-published' : 'badge-draft'}">
                    ${n.is_published ? '게시중' : '비공개'}
                </span>
            </td>
            <td>${n.view_count}</td>
            <td>${formatDate(n.created_at)}</td>
            <td class="action-btns">
                <a href="/admin/notices/${n.id}/edit" class="action-btn">수정</a>
                <button class="action-btn delete" onclick="deleteNotice(${n.id})">삭제</button>
            </td>
        </tr>
    `).join('');
}

function updatePagination(data) {
    const el = document.getElementById('pagination');
    totalPages = data.total_pages;
    
    if (data.total > 0) {
        el.style.display = 'flex';
        document.getElementById('pageInfo').textContent = `${currentPage} / ${totalPages}`;
        document.getElementById('prevBtn').disabled = currentPage <= 1;
        document.getElementById('nextBtn').disabled = currentPage >= totalPages;
    } else {
        el.style.display = 'none';
    }
}

async function deleteNotice(id) {
    if (!confirm('정말 삭제하시겠습니까?')) return;
    
    try {
        const res = await fetch(`/api/v1/admin/notices/${id}`, { method: 'DELETE' });
        if (res.ok) {
            loadNotices();
        } else {
            alert('삭제 실패');
        }
    } catch (e) {
        alert('삭제 중 오류 발생');
    }
}

function formatDate(dateStr) {
    return new Date(dateStr).toLocaleDateString('ko-KR');
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

document.getElementById('searchInput').addEventListener('input', () => {
    currentPage = 1;
    loadNotices();
});

document.getElementById('prevBtn').addEventListener('click', () => {
    if (currentPage > 1) { currentPage--; loadNotices(); }
});

document.getElementById('nextBtn').addEventListener('click', () => {
    if (currentPage < totalPages) { currentPage++; loadNotices(); }
});

loadNotices();
</script>
{% endblock %}
