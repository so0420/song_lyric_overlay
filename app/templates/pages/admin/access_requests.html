{% extends "base/base.html" %}

{% block title %}접근 요청 관리 - 관리자{% endblock %}

{% block extra_styles %}
<style>
    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
    }

    .page-title {
        font-size: 1.5rem;
        font-weight: 700;
    }

    .back-link {
        color: var(--text-sub);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
    }

    .back-link:hover {
        color: var(--accent);
    }

    /* Stats */
    .stats-row {
        display: flex;
        gap: 24px;
        margin-bottom: 24px;
        flex-wrap: wrap;
    }

    .stat-item {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .stat-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
    }

    .stat-dot.pending { background: #f59e0b; }
    .stat-dot.approved { background: #10b981; }
    .stat-dot.rejected { background: #ef4444; }
    .stat-dot.revoked { background: #8b5cf6; }

    .stat-text {
        font-size: 0.9rem;
        color: var(--text-sub);
    }

    .stat-count {
        font-weight: 700;
        color: var(--text-main);
    }

    /* Tabs */
    .tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border-color);
    }

    .tab {
        padding: 12px 20px;
        border: none;
        background: none;
        font-weight: 600;
        cursor: pointer;
        color: var(--text-sub);
        font-size: 0.9rem;
        position: relative;
        transition: color 0.2s;
    }

    .tab:hover { color: var(--text-main); }

    .tab.active {
        color: var(--accent);
    }

    .tab.active::after {
        content: '';
        position: absolute;
        bottom: -1px;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--accent);
    }

    /* Filter Pills */
    .filters {
        display: flex;
        gap: 8px;
        margin-bottom: 16px;
        flex-wrap: wrap;
    }

    .filter-pill {
        padding: 6px 14px;
        border: 1px solid var(--border-color);
        background: white;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        color: var(--text-sub);
    }

    .filter-pill:hover {
        border-color: var(--accent);
        color: var(--accent);
    }

    .filter-pill.active {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
    }

    /* Table */
    .table-container {
        background: white;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        overflow: hidden;
    }

    .data-table {
        width: 100%;
        border-collapse: collapse;
    }

    .data-table th {
        text-align: left;
        padding: 12px 16px;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: #f8fafc;
        border-bottom: 1px solid var(--border-color);
    }

    .data-table td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border-color);
        font-size: 0.9rem;
        vertical-align: middle;
    }

    .data-table tr:last-child td {
        border-bottom: none;
    }

    .data-table tr:hover td {
        background: #fafbfc;
    }

    .user-cell {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .user-avatar {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 0.8rem;
        font-weight: 600;
        flex-shrink: 0;
    }

    .user-name {
        font-weight: 600;
        color: var(--text-main);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 150px;
    }

    .user-email {
        font-size: 0.8rem;
        color: var(--text-dim);
    }

    .url-cell {
        max-width: 200px;
    }

    .url-cell a {
        color: var(--accent);
        text-decoration: none;
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .url-cell a:hover {
        text-decoration: underline;
    }

    .status-badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.75rem;
        font-weight: 600;
    }

    .status-badge.pending { background: #fef3c7; color: #92400e; }
    .status-badge.approved { background: #d1fae5; color: #065f46; }
    .status-badge.rejected { background: #fee2e2; color: #991b1b; }
    .status-badge.revoked { background: #ede9fe; color: #5b21b6; }

    .date-cell {
        font-size: 0.8rem;
        color: var(--text-sub);
        white-space: nowrap;
    }

    .actions-cell {
        white-space: nowrap;
    }

    .btn-sm {
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: all 0.2s;
    }

    .btn-approve {
        background: #10b981;
        color: white;
    }

    .btn-approve:hover { background: #059669; }

    .btn-reject {
        background: #ef4444;
        color: white;
        margin-left: 6px;
    }

    .btn-reject:hover { background: #dc2626; }

    .btn-revoke {
        background: #f59e0b;
        color: white;
    }

    .btn-revoke:hover { background: #d97706; }

    .reason-row td {
        background: #fafbfc;
        padding: 8px 16px 14px 58px;
        font-size: 0.85rem;
        color: var(--text-sub);
        border-bottom: 1px solid var(--border-color);
    }

    .reason-label {
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--text-dim);
        text-transform: uppercase;
        margin-bottom: 4px;
    }

    /* Search */
    .search-box {
        display: flex;
        align-items: center;
        gap: 10px;
        background: white;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 8px 14px;
        margin-bottom: 16px;
        max-width: 300px;
    }

    .search-box:focus-within {
        border-color: var(--accent);
    }

    .search-box svg {
        color: var(--text-dim);
        flex-shrink: 0;
        width: 16px;
        height: 16px;
    }

    .search-input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 0.9rem;
    }

    /* Empty & Loading */
    .empty-state, .loading {
        text-align: center;
        padding: 48px 24px;
        color: var(--text-sub);
    }

    /* Modal */
    .modal-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: all 0.2s;
    }

    .modal-overlay.active {
        opacity: 1;
        visibility: visible;
    }

    .modal {
        background: white;
        border-radius: 12px;
        padding: 24px;
        width: 100%;
        max-width: 400px;
        margin: 16px;
    }

    .modal-title {
        font-size: 1.1rem;
        font-weight: 700;
        margin-bottom: 16px;
    }

    .modal-input {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 0.9rem;
        margin-bottom: 16px;
        resize: vertical;
        min-height: 80px;
        font-family: inherit;
        box-sizing: border-box;
    }

    .modal-input:focus {
        outline: none;
        border-color: var(--accent);
    }

    .modal-actions {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
    }

    .btn-cancel {
        background: #f1f5f9;
        color: var(--text-sub);
    }

    .btn-cancel:hover { background: #e2e8f0; }

    /* Toast */
    .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.9rem;
        transform: translateY(100px);
        opacity: 0;
        transition: all 0.3s ease;
        z-index: 1001;
    }

    .toast.show {
        transform: translateY(0);
        opacity: 1;
    }

    .toast.success { background: #059669; color: white; }
    .toast.error { background: #dc2626; color: white; }

    /* Responsive */
    @media (max-width: 768px) {
        .data-table th:nth-child(3),
        .data-table td:nth-child(3) {
            display: none;
        }

        .user-name { max-width: 100px; }
        .url-cell { max-width: 120px; }
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">접근 요청 관리</h1>
    <a href="/admin" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        대시보드
    </a>
</div>

<div class="stats-row">
    <div class="stat-item">
        <span class="stat-dot pending"></span>
        <span class="stat-text">대기 <span class="stat-count" id="pendingCount">0</span></span>
    </div>
    <div class="stat-item">
        <span class="stat-dot approved"></span>
        <span class="stat-text">승인 <span class="stat-count" id="approvedCount">0</span></span>
    </div>
    <div class="stat-item">
        <span class="stat-dot rejected"></span>
        <span class="stat-text">거절 <span class="stat-count" id="rejectedCount">0</span></span>
    </div>
    <div class="stat-item">
        <span class="stat-dot revoked"></span>
        <span class="stat-text">회수 <span class="stat-count" id="revokedCount">0</span></span>
    </div>
</div>

<div class="tabs">
    <button class="tab active" data-section="requests">요청 목록</button>
    <button class="tab" data-section="users">승인된 사용자</button>
</div>

<!-- 요청 목록 섹션 -->
<div id="requestsSection">
    <div class="filters">
        <button class="filter-pill active" data-status="">전체</button>
        <button class="filter-pill" data-status="pending">대기 중</button>
        <button class="filter-pill" data-status="approved">승인됨</button>
        <button class="filter-pill" data-status="rejected">거절됨</button>
        <button class="filter-pill" data-status="revoked">회수됨</button>
    </div>
    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>사용자</th>
                    <th>플랫폼</th>
                    <th>상태</th>
                    <th>요청일</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="requestsBody">
                <tr><td colspan="5" class="loading">불러오는 중...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 승인된 사용자 섹션 -->
<div id="usersSection" style="display: none;">
    <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" class="search-input" placeholder="이름 또는 이메일 검색...">
    </div>
    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>사용자</th>
                    <th>플랫폼</th>
                    <th>승인일</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="usersBody">
                <tr><td colspan="4" class="loading">불러오는 중...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modals -->
<div class="modal-overlay" id="rejectModal">
    <div class="modal">
        <h3 class="modal-title">요청 거절</h3>
        <textarea class="modal-input" id="rejectReason" placeholder="거절 사유를 입력하세요 (사용자에게 표시됨)"></textarea>
        <input type="hidden" id="rejectRequestId">
        <div class="modal-actions">
            <button class="btn-sm btn-cancel" onclick="closeModal('rejectModal')">취소</button>
            <button class="btn-sm btn-reject" onclick="confirmReject()">거절</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="revokeModal">
    <div class="modal">
        <h3 class="modal-title" id="revokeModalTitle">권한 취소</h3>
        <textarea class="modal-input" id="revokeReason" placeholder="취소 사유를 입력하세요 (사용자에게 표시됨)"></textarea>
        <input type="hidden" id="revokeUserId">
        <div class="modal-actions">
            <button class="btn-sm btn-cancel" onclick="closeModal('revokeModal')">취소</button>
            <button class="btn-sm btn-revoke" onclick="confirmRevoke()">권한 취소</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>
{% endblock %}

{% block extra_scripts %}
<script>
let requests = [];
let users = [];
let currentFilter = '';
let searchDebounce = null;

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');

        const section = tab.dataset.section;
        document.getElementById('requestsSection').style.display = section === 'requests' ? 'block' : 'none';
        document.getElementById('usersSection').style.display = section === 'users' ? 'block' : 'none';

        if (section === 'users') loadUsers();
    });
});

// Filter pills
document.querySelectorAll('.filter-pill').forEach(pill => {
    pill.addEventListener('click', () => {
        document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentFilter = pill.dataset.status;
        loadRequests();
    });
});

// Search
document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => loadUsers(e.target.value), 300);
});

// Load requests
async function loadRequests() {
    const tbody = document.getElementById('requestsBody');
    tbody.innerHTML = '<tr><td colspan="5" class="loading">불러오는 중...</td></tr>';

    try {
        let url = '/api/v1/admin/access-requests';
        if (currentFilter) url += `?status=${currentFilter}`;

        const res = await fetch(url);
        requests = await res.json();
        renderRequests();
        updateStats();
    } catch (e) {
        tbody.innerHTML = '<tr><td colspan="5" class="loading">불러오기 실패</td></tr>';
    }
}

function renderRequests() {
    const tbody = document.getElementById('requestsBody');

    if (requests.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">요청이 없습니다</td></tr>';
        return;
    }

    tbody.innerHTML = requests.map(req => {
        const initial = (req.user_name || req.user_email || '?')[0].toUpperCase();
        const date = new Date(req.created_at).toLocaleDateString('ko-KR');
        const statusMap = { pending: '대기 중', approved: '승인됨', rejected: '거절됨', revoked: '회수됨' };

        let actions = '';
        if (req.status === 'pending') {
            actions = `
                <button class="btn-sm btn-approve" onclick="approveRequest(${req.id})">승인</button>
                <button class="btn-sm btn-reject" onclick="openRejectModal(${req.id})">거절</button>
            `;
        }

        let reasonRow = '';
        if ((req.status === 'rejected' || req.status === 'revoked') && req.rejection_reason) {
            const label = req.status === 'rejected' ? '거절 사유' : '회수 사유';
            reasonRow = `
                <tr class="reason-row">
                    <td colspan="5">
                        <div class="reason-label">${label}</div>
                        ${escapeHtml(req.rejection_reason)}
                    </td>
                </tr>
            `;
        }

        return `
            <tr>
                <td>
                    <div class="user-cell">
                        <div class="user-avatar">${initial}</div>
                        <div>
                            <div class="user-name">${escapeHtml(req.user_name || '이름 없음')}</div>
                            <div class="user-email">${escapeHtml(req.user_email || '')}</div>
                        </div>
                    </div>
                </td>
                <td class="url-cell">
                    <a href="${escapeHtml(req.platform_url)}" target="_blank">${escapeHtml(req.platform_url)}</a>
                </td>
                <td><span class="status-badge ${req.status}">${statusMap[req.status]}</span></td>
                <td class="date-cell">${date}</td>
                <td class="actions-cell">${actions}</td>
            </tr>
            ${reasonRow}
        `;
    }).join('');
}

function updateStats() {
    if (currentFilter) {
        fetch('/api/v1/admin/access-requests').then(r => r.json()).then(all => {
            document.getElementById('pendingCount').textContent = all.filter(r => r.status === 'pending').length;
            document.getElementById('approvedCount').textContent = all.filter(r => r.status === 'approved').length;
            document.getElementById('rejectedCount').textContent = all.filter(r => r.status === 'rejected').length;
            document.getElementById('revokedCount').textContent = all.filter(r => r.status === 'revoked').length;
        });
    } else {
        document.getElementById('pendingCount').textContent = requests.filter(r => r.status === 'pending').length;
        document.getElementById('approvedCount').textContent = requests.filter(r => r.status === 'approved').length;
        document.getElementById('rejectedCount').textContent = requests.filter(r => r.status === 'rejected').length;
        document.getElementById('revokedCount').textContent = requests.filter(r => r.status === 'revoked').length;
    }
}

// Load users
async function loadUsers(search = '') {
    const tbody = document.getElementById('usersBody');
    tbody.innerHTML = '<tr><td colspan="4" class="loading">불러오는 중...</td></tr>';

    try {
        let url = '/api/v1/admin/approved-users';
        if (search) url += `?search=${encodeURIComponent(search)}`;

        const res = await fetch(url);
        users = await res.json();
        renderUsers();
    } catch (e) {
        tbody.innerHTML = '<tr><td colspan="4" class="loading">불러오기 실패</td></tr>';
    }
}

function renderUsers() {
    const tbody = document.getElementById('usersBody');

    if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty-state">승인된 사용자가 없습니다</td></tr>';
        return;
    }

    tbody.innerHTML = users.map(user => {
        const initial = (user.name || user.email || '?')[0].toUpperCase();
        const date = user.approved_at ? new Date(user.approved_at).toLocaleDateString('ko-KR') : '-';

        return `
            <tr>
                <td>
                    <div class="user-cell">
                        <div class="user-avatar">${initial}</div>
                        <div>
                            <div class="user-name">${escapeHtml(user.name || '이름 없음')}</div>
                            <div class="user-email">${escapeHtml(user.email || '')}</div>
                        </div>
                    </div>
                </td>
                <td class="url-cell">
                    ${user.platform_url ? `<a href="${escapeHtml(user.platform_url)}" target="_blank">${escapeHtml(user.platform_url)}</a>` : '-'}
                </td>
                <td class="date-cell">${date}</td>
                <td class="actions-cell">
                    <button class="btn-sm btn-revoke" onclick="openRevokeModal(${user.id}, '${escapeHtml(user.name || user.email)}')">권한 취소</button>
                </td>
            </tr>
        `;
    }).join('');
}

// Actions
async function approveRequest(id) {
    if (!confirm('승인하시겠습니까?')) return;

    try {
        const res = await fetch(`/api/v1/admin/access-requests/${id}/approve`, { method: 'POST' });
        if (res.ok) {
            showToast('승인되었습니다', 'success');
            loadRequests();
        } else {
            showToast('승인 실패', 'error');
        }
    } catch (e) {
        showToast('오류 발생', 'error');
    }
}

function openRejectModal(id) {
    document.getElementById('rejectRequestId').value = id;
    document.getElementById('rejectReason').value = '';
    document.getElementById('rejectModal').classList.add('active');
}

function openRevokeModal(id, name) {
    document.getElementById('revokeUserId').value = id;
    document.getElementById('revokeReason').value = '';
    document.getElementById('revokeModalTitle').textContent = `권한 취소 - ${name}`;
    document.getElementById('revokeModal').classList.add('active');
}

function closeModal(id) {
    document.getElementById(id).classList.remove('active');
}

async function confirmReject() {
    const id = document.getElementById('rejectRequestId').value;
    const reason = document.getElementById('rejectReason').value.trim();

    if (!reason) {
        showToast('사유를 입력하세요', 'error');
        return;
    }

    try {
        const res = await fetch(`/api/v1/admin/access-requests/${id}/reject`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reason })
        });

        if (res.ok) {
            showToast('거절되었습니다', 'success');
            closeModal('rejectModal');
            loadRequests();
        } else {
            showToast('거절 실패', 'error');
        }
    } catch (e) {
        showToast('오류 발생', 'error');
    }
}

async function confirmRevoke() {
    const id = document.getElementById('revokeUserId').value;
    const reason = document.getElementById('revokeReason').value.trim();

    if (!reason) {
        showToast('사유를 입력하세요', 'error');
        return;
    }

    try {
        const res = await fetch(`/api/v1/admin/users/${id}/revoke-overlay`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reason })
        });

        if (res.ok) {
            showToast('권한이 취소되었습니다', 'success');
            closeModal('revokeModal');
            loadUsers();
        } else {
            showToast('취소 실패', 'error');
        }
    } catch (e) {
        showToast('오류 발생', 'error');
    }
}

// Utils
function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showToast(msg, type) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.className = 'toast show ' + type;
    setTimeout(() => toast.className = 'toast', 3000);
}

// ESC to close modals
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        closeModal('rejectModal');
        closeModal('revokeModal');
    }
});

['rejectModal', 'revokeModal'].forEach(id => {
    document.getElementById(id).addEventListener('click', e => {
        if (e.target.id === id) closeModal(id);
    });
});

// Init
loadRequests();
</script>
{% endblock %}
