{% extends "base/base.html" %}

{% block title %}접근 요청 관리 - 관리자{% endblock %}

{% block extra_styles %}
<style>
    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
    }

    .page-title {
        font-size: 1.5rem;
        font-weight: 700;
    }

    .back-link {
        color: var(--text-sub);
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.9rem;
    }

    .back-link:hover {
        color: var(--accent);
    }

    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
    }

    .stat-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        text-align: center;
    }

    .stat-value {
        font-size: 2rem;
        font-weight: 700;
        line-height: 1;
    }

    .stat-value.pending { color: #f59e0b; }
    .stat-value.approved { color: #10b981; }
    .stat-value.rejected { color: #ef4444; }

    .stat-label {
        font-size: 0.85rem;
        color: var(--text-sub);
        margin-top: 8px;
    }

    .filter-tabs {
        display: flex;
        gap: 8px;
        margin-bottom: 24px;
        flex-wrap: wrap;
    }

    .filter-tab {
        padding: 10px 20px;
        border: 1px solid var(--border-color);
        background: white;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.9rem;
    }

    .filter-tab:hover {
        border-color: var(--accent);
        color: var(--accent);
    }

    .filter-tab.active {
        background: var(--accent);
        border-color: var(--accent);
        color: white;
    }

    .requests-container {
        background: white;
        border: 1px solid var(--border-color);
        border-radius: 16px;
        overflow: hidden;
    }

    .request-card {
        padding: 20px 24px;
        border-bottom: 1px solid var(--border-color);
        transition: background 0.2s;
    }

    .request-card:last-child {
        border-bottom: none;
    }

    .request-card:hover {
        background: #f8fafc;
    }

    .request-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 12px;
    }

    .user-info {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .user-avatar {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
    }

    .user-details {
        display: flex;
        flex-direction: column;
    }

    .user-name {
        font-weight: 600;
        color: var(--text-main);
    }

    .user-email {
        font-size: 0.85rem;
        color: var(--text-sub);
    }

    .request-status {
        display: inline-flex;
        align-items: center;
        padding: 6px 12px;
        border-radius: 9999px;
        font-size: 0.8rem;
        font-weight: 600;
    }

    .status-pending {
        background: #fef3c7;
        color: #92400e;
    }

    .status-approved {
        background: #d1fae5;
        color: #065f46;
    }

    .status-rejected {
        background: #fee2e2;
        color: #991b1b;
    }

    .request-body {
        margin-bottom: 16px;
    }

    .platform-url {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
    }

    .platform-url a {
        color: var(--accent);
        text-decoration: none;
        word-break: break-all;
    }

    .platform-url a:hover {
        text-decoration: underline;
    }

    .request-message {
        background: #f8fafc;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 0.9rem;
        color: var(--text-sub);
        line-height: 1.6;
        white-space: pre-wrap;
        margin-top: 12px;
    }

    .request-date {
        font-size: 0.8rem;
        color: var(--text-dim);
        margin-top: 8px;
    }

    .rejection-info {
        background: #fee2e2;
        padding: 12px 16px;
        border-radius: 8px;
        margin-top: 12px;
    }

    .rejection-label {
        font-size: 0.8rem;
        font-weight: 600;
        color: #991b1b;
        margin-bottom: 4px;
    }

    .rejection-reason {
        font-size: 0.9rem;
        color: #7f1d1d;
    }

    .request-actions {
        display: flex;
        gap: 12px;
        margin-top: 16px;
    }

    .btn {
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: all 0.2s;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .btn-approve {
        background: #10b981;
        color: white;
    }

    .btn-approve:hover {
        background: #059669;
    }

    .btn-reject {
        background: #ef4444;
        color: white;
    }

    .btn-reject:hover {
        background: #dc2626;
    }

    .empty-state {
        text-align: center;
        padding: 48px 24px;
        color: var(--text-sub);
    }

    .empty-state svg {
        width: 64px;
        height: 64px;
        margin-bottom: 16px;
        opacity: 0.5;
    }

    /* Modal */
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: all 0.2s;
    }

    .modal-overlay.active {
        opacity: 1;
        visibility: visible;
    }

    .modal {
        background: white;
        border-radius: 16px;
        padding: 24px;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        transform: translateY(-20px);
        transition: transform 0.2s;
    }

    .modal-overlay.active .modal {
        transform: translateY(0);
    }

    .modal-title {
        font-size: 1.2rem;
        font-weight: 700;
        margin-bottom: 16px;
    }

    .modal-input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        font-size: 1rem;
        margin-bottom: 16px;
        outline: none;
        box-sizing: border-box;
        resize: vertical;
        min-height: 100px;
        font-family: inherit;
    }

    .modal-input:focus {
        border-color: var(--accent);
    }

    .modal-actions {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
    }

    .btn-cancel {
        background: #f1f5f9;
        color: var(--text-sub);
    }

    .btn-cancel:hover {
        background: #e2e8f0;
    }

    /* Toast */
    .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        background: var(--text-main);
        color: white;
        padding: 16px 24px;
        border-radius: 12px;
        font-weight: 600;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        transform: translateY(100px);
        opacity: 0;
        transition: all 0.3s ease;
        z-index: 1001;
    }

    .toast.show {
        transform: translateY(0);
        opacity: 1;
    }

    .toast.success {
        background: #059669;
    }

    .toast.error {
        background: #dc2626;
    }

    .loading {
        text-align: center;
        padding: 48px;
        color: var(--text-sub);
    }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">접근 요청 관리</h1>
    <a href="/admin" class="back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        대시보드로 돌아가기
    </a>
</div>

<div class="stats-grid" id="statsGrid">
    <div class="stat-card">
        <div class="stat-value pending" id="pendingCount">-</div>
        <div class="stat-label">대기 중</div>
    </div>
    <div class="stat-card">
        <div class="stat-value approved" id="approvedCount">-</div>
        <div class="stat-label">승인됨</div>
    </div>
    <div class="stat-card">
        <div class="stat-value rejected" id="rejectedCount">-</div>
        <div class="stat-label">거절됨</div>
    </div>
</div>

<div class="filter-tabs">
    <button class="filter-tab active" data-status="">전체</button>
    <button class="filter-tab" data-status="pending">대기 중</button>
    <button class="filter-tab" data-status="approved">승인됨</button>
    <button class="filter-tab" data-status="rejected">거절됨</button>
</div>

<div class="requests-container">
    <div id="requestsList">
        <div class="loading">불러오는 중...</div>
    </div>
</div>

<!-- Reject Modal -->
<div class="modal-overlay" id="rejectModal">
    <div class="modal">
        <h3 class="modal-title">요청 거절</h3>
        <p style="color: var(--text-sub); margin-bottom: 16px; font-size: 0.9rem;">
            거절 사유를 입력해주세요. 사용자에게 표시됩니다.
        </p>
        <textarea class="modal-input" id="rejectReason" placeholder="거절 사유를 입력하세요"></textarea>
        <input type="hidden" id="rejectRequestId">
        <div class="modal-actions">
            <button class="btn btn-cancel" onclick="closeRejectModal()">취소</button>
            <button class="btn btn-reject" onclick="confirmReject()">거절하기</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>
{% endblock %}

{% block extra_scripts %}
<script>
let requests = [];
let currentFilter = '';

// Filter tabs
document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.status;
        loadRequests();
    });
});

async function loadRequests() {
    const container = document.getElementById('requestsList');
    container.innerHTML = '<div class="loading">불러오는 중...</div>';

    try {
        let url = '/api/v1/admin/access-requests';
        if (currentFilter) {
            url += `?status=${currentFilter}`;
        }

        const res = await fetch(url);
        if (res.ok) {
            requests = await res.json();
            renderRequests();
            updateStats();
        }
    } catch (e) {
        container.innerHTML = '<div class="loading">불러오기 실패</div>';
    }
}

function renderRequests() {
    const container = document.getElementById('requestsList');

    if (requests.length === 0) {
        container.innerHTML = `
            <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                <p>요청이 없습니다</p>
            </div>
        `;
        return;
    }

    container.innerHTML = requests.map(req => {
        const statusClass = {
            pending: 'status-pending',
            approved: 'status-approved',
            rejected: 'status-rejected'
        }[req.status];

        const statusText = {
            pending: '대기 중',
            approved: '승인됨',
            rejected: '거절됨'
        }[req.status];

        const initial = (req.user_name || req.user_email || '?')[0].toUpperCase();
        const date = new Date(req.created_at).toLocaleString('ko-KR');

        let actionsHtml = '';
        if (req.status === 'pending') {
            actionsHtml = `
                <div class="request-actions">
                    <button class="btn btn-approve" onclick="approveRequest(${req.id})">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        승인
                    </button>
                    <button class="btn btn-reject" onclick="openRejectModal(${req.id})">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                        거절
                    </button>
                </div>
            `;
        }

        let rejectionHtml = '';
        if (req.status === 'rejected' && req.rejection_reason) {
            rejectionHtml = `
                <div class="rejection-info">
                    <div class="rejection-label">거절 사유</div>
                    <div class="rejection-reason">${escapeHtml(req.rejection_reason)}</div>
                </div>
            `;
        }

        return `
            <div class="request-card">
                <div class="request-header">
                    <div class="user-info">
                        <div class="user-avatar">${initial}</div>
                        <div class="user-details">
                            <span class="user-name">${escapeHtml(req.user_name || '이름 없음')}</span>
                            <span class="user-email">${escapeHtml(req.user_email || '')}</span>
                        </div>
                    </div>
                    <span class="request-status ${statusClass}">${statusText}</span>
                </div>
                <div class="request-body">
                    <div class="platform-url">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                        </svg>
                        <a href="${escapeHtml(req.platform_url)}" target="_blank" rel="noopener">${escapeHtml(req.platform_url)}</a>
                    </div>
                    ${req.message ? `<div class="request-message">${escapeHtml(req.message)}</div>` : ''}
                    ${rejectionHtml}
                    <div class="request-date">요청일: ${date}</div>
                </div>
                ${actionsHtml}
            </div>
        `;
    }).join('');
}

function updateStats() {
    const pending = requests.filter(r => r.status === 'pending').length;
    const approved = requests.filter(r => r.status === 'approved').length;
    const rejected = requests.filter(r => r.status === 'rejected').length;

    // If we're filtering, fetch all for accurate counts
    if (currentFilter) {
        fetch('/api/v1/admin/access-requests').then(res => res.json()).then(all => {
            document.getElementById('pendingCount').textContent = all.filter(r => r.status === 'pending').length;
            document.getElementById('approvedCount').textContent = all.filter(r => r.status === 'approved').length;
            document.getElementById('rejectedCount').textContent = all.filter(r => r.status === 'rejected').length;
        });
    } else {
        document.getElementById('pendingCount').textContent = pending;
        document.getElementById('approvedCount').textContent = approved;
        document.getElementById('rejectedCount').textContent = rejected;
    }
}

async function approveRequest(requestId) {
    if (!confirm('이 요청을 승인하시겠습니까?')) return;

    try {
        const res = await fetch(`/api/v1/admin/access-requests/${requestId}/approve`, {
            method: 'POST'
        });

        if (res.ok) {
            showToast('요청이 승인되었습니다', 'success');
            loadRequests();
        } else {
            const data = await res.json();
            showToast(data.detail || '승인에 실패했습니다', 'error');
        }
    } catch (e) {
        showToast('오류가 발생했습니다', 'error');
    }
}

function openRejectModal(requestId) {
    document.getElementById('rejectRequestId').value = requestId;
    document.getElementById('rejectReason').value = '';
    document.getElementById('rejectModal').classList.add('active');
}

function closeRejectModal() {
    document.getElementById('rejectModal').classList.remove('active');
}

async function confirmReject() {
    const requestId = document.getElementById('rejectRequestId').value;
    const reason = document.getElementById('rejectReason').value.trim();

    if (!reason) {
        showToast('거절 사유를 입력해주세요', 'error');
        return;
    }

    try {
        const res = await fetch(`/api/v1/admin/access-requests/${requestId}/reject`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reason })
        });

        if (res.ok) {
            showToast('요청이 거절되었습니다', 'success');
            closeRejectModal();
            loadRequests();
        } else {
            const data = await res.json();
            showToast(data.detail || '거절에 실패했습니다', 'error');
        }
    } catch (e) {
        showToast('오류가 발생했습니다', 'error');
    }
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showToast(message, type = '') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast show ' + type;
    setTimeout(() => {
        toast.className = 'toast';
    }, 3000);
}

// Close modal on ESC or overlay click
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeRejectModal();
});

document.getElementById('rejectModal').addEventListener('click', (e) => {
    if (e.target.id === 'rejectModal') closeRejectModal();
});

// Initial load
loadRequests();
</script>
{% endblock %}
